[workspace]
resolver = "3"
members = ["crates/intentsvcs", "crates/intent-cli", "crates/intentd"]

[workspace.package]
version = "3.0.0-dev"
edition = "2024"
authors = ["Matthew Sinclair <hello@matthewsinclair.com>"]
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
# The GraphQL SDL face (AC-02.2). The SDL is EXPORTED from the model types the
# same way the JSON Schema face is -- one authored master, three generated
# faces -- so async-graphql sits with the model in intentsvcs. The server that
# serves this schema is intentd's (D06); only the export lives here.
async-graphql = "7"
# The Highlander dependency: rusqlite is consumed by intentsvcs and NOWHERE
# else (design.md D06). dep_graph_guard.rs asserts this; adding it to another
# crate is a build-time architecture violation, not a style nit.
rusqlite = { version = "0.32", features = ["bundled"] }
ulid = "1"
time = { version = "0.3", features = ["formatting"] }
thiserror = "2"
proptest = "1"
tempfile = "3"
