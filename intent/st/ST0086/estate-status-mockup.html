<!--
  ST0086 MOCKUP of /estate/status (WP-02, with WP-04's controller, lanes and slots).
  Not served by anything yet. One self-contained file: inline CSS and JS, no fetch,
  light and dark from the same tokens as intentd's shell.html.

  The SAMPLE below is the raw records, in the shapes design.md gives them:
    census      what the daemon measures itself (load, cargo and bats, live pids)
    controller  ~/.local/state/intent/estate/slots/controller.json
    lanes       ~/.local/state/intent/estate/slots/lanes/<lane>.json
    requests    ~/.local/state/intent/estate/slots/requests/<id>/{ask,grant,deny,start,end,revoke}.json,
                one object per directory, one key per file present
    sessions    ~/.local/state/intent/estate/<session-id>.json
    boards      what the reader joins from each project's store (focus, claims) for a node;
                never copied into a session record (Highlander)
  `estate()` below stands in for the one intentsvcs reader: it folds the request files to a
  state, joins the boards and the slots onto the sessions, and marks gone and orphaned.
  The renderer only draws its answer.
-->

  // ==========================================================================
  // THE READER (stand-in for the one intentsvcs function). Pure: records in,
  // the joined table out. Readers never write.
  // ==========================================================================
  function ms(stamp) { return Date.parse(stamp); }

  // A request's state is the FOLD of the files present, latest verb wins.
  function requestState(r) {
    if (r.revoke) { return "revoked"; }
    if (r.deny) { return "denied"; }
    if (r.end) { return "ended"; }
    if (r.start) { return "running"; }
    if (r.grant) { return "granted"; }
    return "asked";
  }

  function estate(s) {
    var alive = {};
    s.census.live_pids.forEach(function (p) { alive[p] = true; });
    var byId = {};
    s.sessions.forEach(function (rec) { byId[rec.session_id] = rec; });
    var now = ms(s.census.taken_at);

    var requests = s.requests.map(function (r) {
      var state = requestState(r);
      var holder = byId[r.ask.session_id];
      var holderGone = !holder || !alive[holder.pid];
      var live = state === "granted" || state === "running";
      var since = r.start ? r.start.at : r.grant ? r.grant.at : r.ask.at;
      return {
        id: r.id, type: r.ask.type, what: r.ask.what,
        lane: r.grant ? r.grant.lane : null, wanted_lane: r.ask.lane || null,
        state: state, orphaned: live && holderGone,
        requester: holder ? holder.name : r.ask.session_id.slice(0, 8),
        age_s: Math.max(0, Math.round((now - ms(since)) / 1000))
      };
    });

    var lanes = s.lanes.map(function (l) {
      var holders = requests.filter(function (r) {
        return r.lane === l.lane && (r.state === "granted" || r.state === "running");
      });
      return { lane: l.lane, type: l.type, capacity: l.capacity, holders: holders };
    });

    // Queued is per TYPE: an ask belongs to no lane until granted.
    var queues = {};
    requests.forEach(function (r) {
      if (r.state === "asked") { (queues[r.type] = queues[r.type] || []).push(r); }
    });
    Object.keys(queues).forEach(function (t) {
      queues[t].sort(function (a, b) { return b.age_s - a.age_s; });
    });

    var ctl = s.controller;
    var controller = ctl ? {
      name: ctl.name, session_id: ctl.session_id, pid: ctl.pid,
      orphaned: !alive[ctl.pid],
      where: (function () {
        var rec = byId[ctl.session_id];
        if (!rec || !rec.project_root) { return "dedicated"; }
        return base(rec.project_root) + (rec.node ? " / " + rec.node : "");
      })()
    } : null;

    var sessions = s.sessions.map(function (rec) {
      var gone = !alive[rec.pid];
      var held = requests.filter(function (r) {
        return r.requester === rec.name && (r.state === "granted" || r.state === "running");
      });
      var running = held.some(function (r) { return r.state === "running"; });
      var board = rec.project_root && rec.node && s.boards[rec.project_root]
        ? s.boards[rec.project_root][rec.node] : null;
      return {
        name: rec.name,
        project: rec.project_root ? base(rec.project_root) : "",
        node: rec.node || "",
        // Presence comes from the record; heavy is JOINED from a running slot
        // and gone from a dead pid -- neither is a field the session writes.
        state: gone ? "gone" : running ? "heavy" : rec.state,
        since_s: Math.round((now - ms(rec.started_at)) / 1000),
        hb_s: Math.round((now - ms(rec.updated_at)) / 1000),
        slots: held,
        claims: board ? board.claims : [],
        line: board ? board.focus : (rec.wip || ""),
        line_is_wip: !board
      };
    });
    sessions.sort(function (a, b) {
      var pa = a.project || "\uffff", pb = b.project || "\uffff";
      return pa < pb ? -1 : pa > pb ? 1 : a.name < b.name ? -1 : a.name > b.name ? 1 : 0;
    });

    return { census: s.census, controller: controller, lanes: lanes, queues: queues, sessions: sessions };
  }

  function base(p) { return p.replace(/\/+$/, "").split("/").pop(); }

  // ==========================================================================
  // THE RENDERER. Built with textContent, never innerHTML (shell.html's rule):
  // every value is somebody's prose out of their own estate.
  // ==========================================================================
  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) { n.className = cls; }
    if (text !== undefined && text !== null) { n.textContent = text; }
    return n;
  }
  function td(text, cls) { return el("td", cls, text); }

  function age(s) {
    if (s < 60) { return s + "s"; }
    if (s < 3600) { return Math.floor(s / 60) + "m" + String(s % 60).padStart(2, "0"); }
    if (s < 86400) { return Math.floor(s / 3600) + "h" + String(Math.floor(s % 3600 / 60)).padStart(2, "0"); }
    return Math.floor(s / 86400) + "d" + String(Math.floor(s % 86400 / 3600)).padStart(2, "0") + "h";
  }

  function line(parts) {
    var frag = document.createDocumentFragment();
    parts.forEach(function (p) {
      frag.appendChild(typeof p === "string" ? document.createTextNode(p) : el("span", p[0], p[1]));
    });
    frag.appendChild(document.createTextNode("\n"));
    return frag;
  }

  function renderHead(e) {
    var c = e.census;
    var head = document.getElementById("head");
    var tally = {};
    e.sessions.forEach(function (s) { tally[s.state] = (tally[s.state] || 0) + 1; });
    var tallyText = ["busy", "heavy", "idle", "paused", "gone"]
      .filter(function (k) { return tally[k]; })
      .map(function (k) { return tally[k] + " " + k; }).join(", ");
    var ctl;
    if (!e.controller) {
      ctl = [["k", "controller "], ["warn", "NO CONTROLLER"], " -- asks queue and nothing is granted"];
    } else if (e.controller.orphaned) {
      ctl = [["k", "controller "], ["warn", e.controller.name + " ORPHANED"], " (pid " + e.controller.pid + " is dead; the next `control take` succeeds it)"];
    } else {
      ctl = [["k", "controller "], e.controller.name, ["k", "  session "], e.controller.session_id.slice(0, 8),
             ["k", "  pid "], String(e.controller.pid), ["k", "  in "], e.controller.where];
    }
    head.replaceChildren(
      line([["k", "estate "], c.host, "   ", c.version, ["k", "   at "], c.taken_at.replace("T", " ")]),
      line([["k", "load "], c.load.map(function (x) { return x.toFixed(2); }).join(" "),
            ["k", "   cargo "], String(c.cargo), ["k", "   bats "], String(c.bats),
            ["k", "   sessions "], String(e.sessions.length), ["k", ": "], tallyText]),
      line(ctl)
    );
  }

  function renderLanes(e) {
    var body = document.getElementById("lanes");
    var rows = document.createDocumentFragment();
    var shownQueue = {};
    e.lanes.forEach(function (l) {
      var used = l.holders.length;
      var tr = el("tr", "lane");
      tr.append(td(l.lane), td(l.type), td(used + "/" + l.capacity), td(used >= l.capacity ? "full" : "open", used >= l.capacity ? "st-running" : "muted"), td(""), td(""), td(""));
      rows.appendChild(tr);
      l.holders.forEach(function (r) { rows.appendChild(reqRow(r)); });
      // The queue is per type, so it is drawn once, under the first lane of
      // that type, and says so.
      var q = e.queues[l.type];
      if (q && !shownQueue[l.type]) {
        shownQueue[l.type] = true;
        q.forEach(function (r) { rows.appendChild(reqRow(r, true)); });
      }
    });
    body.replaceChildren(rows);
  }

  function reqRow(r, queued) {
    var tr = el("tr", "req");
    var state = r.orphaned ? "orphaned" : r.state;
    var whatCell = td(r.what, "wide");
    if (queued) {
      whatCell.appendChild(el("span", "muted", "  (queued on type " + r.type + (r.wanted_lane ? ", asks for " + r.wanted_lane : "") + ")"));
    }
    tr.append(td(r.id), td(""), td(""), td(state, "st-" + state), td(r.requester, r.orphaned ? "orph" : ""), whatCell, td(age(r.age_s), "num"));
    return tr;
  }

  function renderSessions(e) {
    var q = document.getElementById("filter").value.trim().toLowerCase();
    var body = document.getElementById("sessions");
    var rows = document.createDocumentFragment();
    var shown = 0;
    e.sessions.forEach(function (s) {
      var hay = [s.name, s.project, s.node, s.state, s.line, s.claims.join(" ")].join(" ").toLowerCase();
      if (q && hay.indexOf(q) < 0) { return; }
      shown += 1;
      var tr = el("tr", s.state === "gone" ? "gone" : "");
      var slots = td("");
      s.slots.forEach(function (r, i) {
        if (i) { slots.appendChild(document.createTextNode(" ")); }
        slots.appendChild(el("span", r.orphaned ? "orph" : "st-" + r.state, r.lane + ":" + r.id + (r.orphaned ? " ORPHANED" : "")));
      });
      var lineCell = td("", "wide");
      if (s.line) {
        if (s.line_is_wip) { lineCell.appendChild(el("span", "muted", "wip ")); }
        lineCell.appendChild(document.createTextNode(s.line));
      }
      tr.append(
        td(s.name), td(s.project || "--", s.project ? "" : "muted"), td(s.node || "--", s.node ? "" : "muted"),
        td(s.state, "state st-" + s.state), td(age(s.since_s), "num"), td(age(s.hb_s), "num"),
        slots, td(s.claims.join(", ")), lineCell
      );
      rows.appendChild(tr);
    });
    body.replaceChildren(rows);
    document.getElementById("foot").textContent =
      (q ? shown + " of " + e.sessions.length + " sessions match \"" + q + "\". " : "") +
      "Mockup: re-rendered every 2s against the inline sample, with a scripted sequence of grants, starts and ends so the live behaviour shows. The served page reads the same shape from the daemon.";
  }

  function render() {
    var e = estate(model);
    renderHead(e);
    renderLanes(e);
    renderSessions(e);
  }

  // ==========================================================================
  // THE SIMULATION. Mockup only: a clock that advances and a short script of
  // the writes each party would make, replayed in a loop.
  // ==========================================================================
  var model, tick = 0, paused = false;
  function reset() { model = JSON.parse(JSON.stringify(SAMPLE)); tick = 0; }
  function findReq(id) { return model.requests.filter(function (r) { return r.id === id; })[0]; }
  function findSess(name) { return model.sessions.filter(function (r) { return r.name === name; })[0]; }
  function nowIso() { return model.census.taken_at; }

  var SCRIPT = {
    3:  function () { findReq("r-0144").grant = { lane: "bats", at: nowIso() }; },
    5:  function () { findReq("r-0144").start = { at: nowIso() }; findSess("intent-cc").state = "busy"; findSess("intent-cc").updated_at = nowIso(); model.census.bats = 1; },
    8:  function () { findReq("r-0142").end = { at: nowIso() }; findSess("devbin-cc").updated_at = nowIso(); model.census.cargo = 0; },
    9:  function () { findSess("devbin-cc").state = "idle"; },
    11: function () { findReq("r-0145").grant = { lane: "cargo", at: nowIso() }; },
    13: function () { findReq("r-0145").start = { at: nowIso() }; findSess("utilz-cc").updated_at = nowIso(); model.census.cargo = 4; },
    15: function () { findReq("r-0139").revoke = { at: nowIso(), why: "holder gone" }; },
    17: function () { model.requests.push({ id: "r-0146", ask: { session_id: "4d7b2e90-c18f-4a35-8e6d-5a9f0c3b7e21", type: "kovacs", what: "brew install intent 3.2.6 on kovacs", at: nowIso() } }); findSess("utilz-vc").state = "busy"; findSess("utilz-vc").updated_at = nowIso(); }
  };
  var LOOP = 24;

  function step() {
    if (paused) { return; }
    tick += 1;
    if (tick > LOOP) { reset(); render(); return; }
    var t = ms(model.census.taken_at) + 2000;
    model.census.taken_at = new Date(t).toISOString().replace(/\.\d+Z$/, "Z");
    var w = Math.sin(tick / 3);
    model.census.load = [11.2 + w * 1.4, 10.16 + w * .5, 10.84 + w * .15];
    ["intent-vc", "intent-ic", "molt-vc"].forEach(function (n) {
      if (tick % 3 === 0) { findSess(n).updated_at = nowIso(); }
    });
    if (SCRIPT[tick]) { SCRIPT[tick](); }
    render();
  }

  document.getElementById("filter").addEventListener("input", render);
  document.getElementById("pause").addEventListener("click", function (ev) {
    paused = !paused;
    ev.target.textContent = paused ? "resume" : "pause";
  });

  reset();
  render();
  window.setInterval(step, 2000);
</script>
