# Sample .intent_critic.yml — copy to the project root and edit as needed.
#
# Read by: the headless `intent critic <lang>` (`disabled` only); the
# pre-commit gate (`severity_min`, passed as --severity-min); the critic
# subagents (critic-elixir, critic-rust, critic-swift, critic-lua,
# critic-shell, critic-prose: `disabled`, `severity_min`, `show_all`); and
# post-tool-advisory.sh (`post_tool_use_advisory`). Absence is silent. Only
# the subagents warn on malformed YAML.
#
# Schema (all keys optional):
#
#   disabled:        list of rule IDs to suppress entirely for this project.
#                    Add a trailing `# reason: ...` comment on each entry so
#                    future readers see why the rule was opted out. Keep the
#                    `disabled:` line itself bare: the headless runner reads
#                    a block list only when nothing follows the colon.
#
#   severity_min:    minimum severity rendered in the report body. One of
#                    `critical` | `warning` | `recommendation` | `style`.
#                    Default: `warning` (body shows CRITICAL + WARNING; the
#                    `Summary:` line still counts every severity).
#
#   show_all:        shorthand for `severity_min: style`, honoured by the
#                    critic subagents only. The pre-commit gate ignores it.
#
#   post_tool_use_advisory: `true` makes .claude/scripts/post-tool-advisory.sh
#                    run `intent critic <lang> --files <edited-file>` after
#                    each edit. Default: false.

disabled:
  - IN-EX-CODE-003 # reason: <why this project opts out>
  - IN-RS-CODE-005 # reason: explicit lifetimes preferred in our domain code

severity_min: warning

# show_all: true    # uncomment to show recommendation + style in the body
