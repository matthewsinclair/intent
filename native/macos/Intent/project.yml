name: Intent
options:
  bundleIdPrefix: com.matthewsinclair
  deploymentTarget:
    macOS: "26.0"
  # The Xcode floor, as menuz's spec has it (issue 0607, hv's "Xcode 27.x"):
  # equal to the installed Xcode, so `xcodegen generate` raises no "Update to
  # Recommended Settings" dialog.
  xcodeVersion: "27.1"
  generateEmptyDirectories: true
# Ported from Geodica's project.yml (~/Devel/prj/Gtools/native/macos/Gtools),
# itself cut from Conflab's. The menubar app shells out to `intent` (and to
# `/bin/zsh` once per launch, for the login PATH) and holds no product logic
# (AC-01.1). One package, arca_swift, for the menu's masthead row and its About
# window, as Gtools' and menuz's specs take it (issue 0607). Both configs sign
# with the Geodica ADC team on this machine; Developer ID signing +
# notarisation for distribution is the `int macos app-sign | app-notarize` path
# (AC-01.7), never this spec.
configs:
  Debug: debug
  Release: release
packages:
  # XcodeGen's up-to-next-minor: before 1.0 a minor release may change the
  # API, so a new one is taken on purpose, never by a fresh resolve. It needs
  # macOS 26 and Swift 6.2, which the deployment target and the Xcode floor
  # above meet.
  ArcaSwift:
    url: https://github.com/builtwitharca/arca_swift
    minorVersion: 0.1.1
settings:
  base:
    SWIFT_VERSION: "6.0"
    # Xcode 16 recommended defaults, baked in so `xcodegen generate` never
    # re-raises the "Update to Recommended Settings" dialog.
    DEAD_CODE_STRIPPING: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    STRING_CATALOG_GENERATE_SYMBOLS: YES
    ASSETCATALOG_COMPILER_GENERATE_ASSET_SYMBOLS: YES
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
    # The stamps, substituted into Info.plist. `int macos app-build` overrides
    # each of them on the xcodebuild command line from the source tree + git; a
    # build from inside Xcode gets these defaults, so the stamped Info.plist
    # keys say "dev" rather than lying. No generated Swift file (Conflab's
    # BuildInfo lesson).
    INTENT_VERSION: dev
    INTENT_BUILD: "0"
    INTENT_COMMIT: dev
    INTENT_SOURCE_TREE: dev
  configs:
    Debug:
      CODE_SIGN_STYLE: Automatic
      DEVELOPMENT_TEAM: 76BQL8L47U
    Release:
      CODE_SIGN_STYLE: Automatic
      DEVELOPMENT_TEAM: 76BQL8L47U
targets:
  Intent:
    type: application
    platform: macOS
    sources:
      - Intent
    dependencies:
      - package: ArcaSwift
        product: ArcaMasthead
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.matthewsinclair.intent.macos
        INFOPLIST_FILE: Intent/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
      configs:
        Debug:
          CODE_SIGN_ENTITLEMENTS: Intent/Intent.Debug.entitlements
        Release:
          CODE_SIGN_ENTITLEMENTS: Intent/Intent.entitlements
    scheme:
      testTargets:
        - IntentTests
  IntentTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - IntentTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Intent
