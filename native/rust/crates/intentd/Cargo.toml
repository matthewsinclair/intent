[package]
name = "intentd"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Intent v3 daemon: one per machine, N projects; socket GraphQL + mgmt plane + watch"

# NOTE (design.md D06): this crate must NEVER depend on rusqlite -- the daemon
# reaches data only through the intentsvcs facade. dep_graph_guard.rs enforces.

# Declared, not left to convention. Cargo's default makes every `.rs` directly under
# `tests/` its own separately linked binary, and that default is silent BOTH ways: it
# grew this workspace to 257 targets, and a `tests/quick.rs` dropped in by anyone in a
# hurry would silently become another. Per hv's estate-wide ruling of 2026-08-27, which
# Laksa took the same day and this workspace -- the one that made it -- never did.
# The single target is `tests/suite.rs`; a new suite is declared there as a module, and
# `no_orphan_suite_member.rs` fails if one is not.
autotests = false

[[bin]]
name = "intentd"
path = "src/main.rs"

# Rationale for both, to AC-08.10's standard, lives beside the pinned versions
# in the workspace manifest -- one home, so a reader who changes the version
# meets the argument for it. These two are consumed HERE and nowhere else.
[dependencies]
# **THE FACADE IS THE ONLY WAY THIS CRATE REACHES DATA, WHICH IS D06 STATED AS A
# DEPENDENCY RATHER THAN AS A RULE.** The daemon serves what the CLI serves, so
# it must call the same surface; the alternative -- a second data path with its
# own SQLite handle -- is the exact thing the NOTE above forbids. Depending on
# `intentsvcs` is therefore not a relaxation of D06, it is how D06 is obeyed:
# `dep_graph_guard.rs` requires `rusqlite` to appear in one manifest and this
# adds none.
#
# It also carries the routing seam. `daemon::Bound` and `daemon::Published` are
# the bind-and-publish constructors the client's probe is designed against, and
# `daemon::is_probe_frame` is the recogniser -- re-spelling any of the three
# here would put the agreement in two homes, on the one predicate whose silent
# disagreement puts two sync engines on one store.
intentsvcs = { path = "../intentsvcs" }
tokio.workspace = true
axum.workspace = true
notify-debouncer-full.workspace = true

[dev-dependencies]
# **THE SAME DEPENDENCY AS ABOVE, DECLARED TWICE BECAUSE A CRATE'S INTEGRATION
# TESTS CANNOT SEE ITS OWN `[dependencies]`.** `tests/` links against the
# package as an external consumer would, and `intentd` has no lib for it to
# link, so without this line the test cannot reach `daemon::route` -- the very
# function AT-08.3 exists to drive against a real daemon. Asserting the routing
# rule with a hand-rolled probe instead would make the test a second home for
# the predicate, which is the one thing this seam cannot afford.
intentsvcs = { path = "../intentsvcs" }

[[test]]
name = "suite"
path = "tests/suite.rs"

# **ITS OWN TARGET, AND THE REASON GIVEN HERE FIRST WAS WRONG.** These rows
# drive the file watcher, whose machinery -- fsevents plus the debouncer -- is
# per process rather than per test, and a separate binary is a separate event
# stream. That is defensible on its own and it is why the target stays.
#
# **IT IS NOT, HOWEVER, A FIX, AND THE FIRST VERSION OF THIS COMMENT CLAIMED IT
# WAS.** The claim was that merging took these rows from ~5 in a process to 28
# and that CPU contention made subscribers cross. Verified with 8 clean
# full-workspace runs and committed at `33ac4348`. hv then hit the same two
# failures INSIDE this isolated target -- 3 passed, 2 failed of 5 -- so the
# isolation changed nothing, and 8 clean runs against an uncharacterised
# intermittent were never evidence.
#
# **DRIVEN TWO-SIDED AFTERWARDS, WHICH INVERTED IT: 0 failures in 10 parallel
# runs, 2 failures in 9 runs at `--test-threads=1`.** Serialising makes it
# WORSE, so parallelism was never the cause.
#
# **THE REAL SHAPE IS EVENT BLEED ACROSS TEST BOUNDARIES, AND THE FAILURE
# MESSAGES SAID SO FROM THE FIRST INSTANCE.** A subscriber is told about
# `intentd-proj-<pid>-15` while another names `-25`: those indices are OTHER
# TESTS' project directories, not a wrong file within one test. Serial runs are
# worse because rows run back-to-back and the previous row's events are still
# in the debounce window when the next subscribes. Whether the scoping is loose
# only in tests or generally is an `intentd` question and is with cc.
[[test]]
name = "daemon_subscriptions"
path = "tests/daemon_subscriptions.rs"
