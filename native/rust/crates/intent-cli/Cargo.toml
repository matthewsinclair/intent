[package]
name = "intent-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Intent v3 CLI: a thin coordinator over the intentsvcs facade (in-process) or GraphQL to intentd"

# NOTE (design.md D06): this crate must NEVER depend on rusqlite -- the CLI
# reaches data only through the intentsvcs facade. dep_graph_guard.rs enforces.

[dependencies]
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
time.workspace = true
intentsvcs = { path = "../intentsvcs" }
# **`IN-RS-CODE-004`, AND THE GATE WAS RIGHT.** `tui::edit`'s first shape
# returned `Result<String, String>` -- a signature where the Ok and Err types are
# the same, so a mistake type-checks -- and it buried the one fact a caller
# genuinely has to ask about (is the operator's text still on disk?) inside prose.
thiserror.workspace = true
terminal_size = "0.4.4"
crossterm = "0.29.0"
# **THE REALISER'S PRINTER, AND IT IS PINNED TO THE CROSSTERM ALREADY HERE.**
# `ratatui` renders the flat aligned column AC-17.11 specifies; it does NOT
# compute that column. Layout is a pure function in `tui::layout` that emits the
# exact strings and their positions, and this crate only puts them on a surface
# -- so the alignment property is asserted on data, and the buffer is checked
# against it rather than being a second opinion about it.
# `default-features = false` plus `crossterm_0_29` is the load-bearing part:
# ratatui's default `crossterm` feature pulls its OWN crossterm, and two
# crossterms in one graph make `tui::terminal`'s borrow-and-return types
# incompatible with the backend that is supposed to draw through them -- a
# Highlander violation the compiler reports as an unrelated type error.
# It enters now rather than earlier because nothing drew until now: `mode`,
# `terminal` and `focus` are all provable without a terminal, and landing them
# first kept a dependency out of a lockfile three other nodes build against
# until the day it earned its place.
ratatui = { version = "0.30.2", default-features = false, features = [
  "crossterm_0_29",
  "std",
  "all-widgets",
  "layout-cache",
  "underline-color",
] }

[lib]
name = "intent_cli"
path = "src/lib.rs"

[[bin]]
name = "intent"
path = "src/main.rs"

[dev-dependencies]
testkit = { path = "../testkit" }
tempfile.workspace = true
# **A TEST-ONLY DEPENDENCY FOR `openpty`, AND IT ADDS NO THIRD-PARTY CODE.**
# `libc` is already in this workspace's lock via the dependency graph, so this
# makes an existing compile unit reachable rather than pulling one in -- the
# same ground the workspace states for `regex`. It is needed because AC-11.6's
# subject exists ONLY on a terminal: `--default --force` is gated on
# `IsTerminal`, so the destructive arm cannot be driven by any test that does
# not present one. Before this, the estate said so in a comment and left the
# arm uncovered.
libc = "0.2"

