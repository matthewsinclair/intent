[package]
name = "intent-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Intent v3 CLI: a thin coordinator over the intentsvcs facade (in-process) or GraphQL to intentd"

# NOTE (design.md D06): this crate must NEVER depend on rusqlite -- the CLI
# reaches data only through the intentsvcs facade. dep_graph_guard.rs enforces.

[dependencies]
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
time.workspace = true
intentsvcs = { path = "../intentsvcs" }
terminal_size = "0.4.4"

[lib]
name = "intent_cli"
path = "src/lib.rs"

[[bin]]
name = "intent"
path = "src/main.rs"

[dev-dependencies]
testkit = { path = "../testkit" }
tempfile.workspace = true
