[package]
name = "intentsvcs"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Intent v3 services: the reified model, schema faces, SQLite store, sync and facade"
build = "build.rs"

# Declared, not left to convention. Cargo's default makes every `.rs` directly under
# `tests/` its own separately linked binary, and that default is silent BOTH ways: it
# grew this workspace to 257 targets, and a `tests/quick.rs` dropped in by anyone in a
# hurry would silently become another. Per hv's estate-wide ruling of 2026-08-27, which
# Laksa took the same day and this workspace -- the one that made it -- never did.
# The single target is `tests/suite.rs`; a new suite is declared there as a module, and
# `no_orphan_suite_member.rs` fails if one is not.
autotests = false

[dependencies]
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true
jsonschema.workspace = true
async-graphql.workspace = true
rusqlite.workspace = true
ulid.workspace = true
uuid.workspace = true
time.workspace = true
thiserror.workspace = true
sha2.workspace = true
ignore.workspace = true
regex.workspace = true
# The critic copies a STAGED file under its own name, in a private directory,
# for a tool that reads a file rather than bytes (issue 0537). The rationale is
# beside the pin in the workspace manifest.
tempfile.workspace = true
# **THE STRUCTURAL TIER, EACH GRAMMAR OPTIONAL AND BEHIND ITS OWN FEATURE**
# (ST0069 WP-20). The runtime is not optional -- `index::symbols` compiles
# either way and simply knows no languages -- while each grammar is, so a build
# carries only the syntaxes it asked for and dc's size measurement prices them
# one at a time. The rationale and the measured deltas sit beside the pins in
# the workspace manifest, which is where the version is decided.
tree-sitter.workspace = true
tree-sitter-rust = { workspace = true, optional = true }
tree-sitter-elixir = { workspace = true, optional = true }
tree-sitter-swift = { workspace = true, optional = true }
tree-sitter-lua = { workspace = true, optional = true }
tree-sitter-bash = { workspace = true, optional = true }

[features]
# **THE FOUR GRAMMARS THAT EARN THEIR BYTES ARE ON BY DEFAULT** (AC-20.4). The
# per-grammar cost was measured before any of them shipped, against a baseline
# from the same HEAD with each grammar referenced behind an opaque condition so
# fat LTO could not drop it; the table is in the thread's design. The default
# set is this one line, so the line moves with a one-line change if it is ruled
# again.
#
# **bash IS DECLARED AND OFF, AND NOT FOR ITS SIZE.** `tree-sitter-bash` ships
# no tags query -- a highlight query only -- so a shell file parses and names no
# symbols and the bytes buy nothing. It comes on when upstream ships a tags
# query; nobody writes one here, because a hand-written query is the
# per-language extractor AC-20.2 exists to avoid.
#
# **A LANGUAGE THE BINARY WAS NOT BUILT WITH PARSES NOTHING, AND SAYS SO**
# rather than silently returning no symbols -- see `index::symbols::symbols_of`.
default = ["lang-rust", "lang-elixir", "lang-swift", "lang-lua"]
lang-rust = ["dep:tree-sitter-rust"]
lang-elixir = ["dep:tree-sitter-elixir"]
lang-swift = ["dep:tree-sitter-swift"]
lang-lua = ["dep:tree-sitter-lua"]
# `shell` in a project's `languages` maps here: bash is the syntax the shell
# rules are written against.
lang-bash = ["dep:tree-sitter-bash"]

[dev-dependencies]
testkit = { path = "../testkit" }
proptest.workspace = true
# **TEST-ONLY, AND IT ADDS NO THIRD-PARTY CODE:** `rusqlite` is already a
# normal dependency of this crate, so this only makes it reachable from
# `tests/`, which cannot see a crate's own dependencies. AC-14.7's proof needs
# to break the store UNDERNEATH the facade -- dropping the `project` table so
# the watermark write fails -- and there is no honest way to do that through
# the public API, because the public API is what is under test.
rusqlite.workspace = true
# **TEST-ONLY, AND IT ADDS NO THIRD-PARTY CODE:** `libc` is already in this
# workspace's lock via the dependency graph, so this makes an existing compile
# unit reachable rather than pulling one in -- the same ground the workspace
# states for `regex`, and the same ground `intent-cli` states for its own
# test-only `libc`. It is needed because `AC-08.11`'s second obligation is a
# DESCRIPTOR FLAG: whether a listener is close-on-exec is not observable
# through any std API, and the only alternative witness -- forking a child and
# watching what it inherits -- measures the outcome rather than the property,
# so it would pass on an unloaded machine with the flag gone.
libc = "0.2"
# **TEST-ONLY, AND IT ADDS NO THIRD-PARTY CODE:** `tokio` is already in this
# workspace's lock as intentd's runtime, so this makes an existing compile unit
# reachable from `tests/` rather than pulling one in. It is needed because the
# GraphQL resolvers are async fns and a test that drives them has to await:
# `graphql_reads_through_the_facade.rs` executes real documents against a real
# store. **THE SHIPPED CRATE STILL CARRIES NO RUNTIME** -- that is the property
# the escape hatch's runtime-free CLI rests on (vc, 2026-08-31) -- and a
# dev-dependency cannot reach a dependent's build graph, which is why this is
# the right section for it and `[dependencies]` never would be.
tokio.workspace = true

[[test]]
name = "suite"
path = "tests/suite.rs"
