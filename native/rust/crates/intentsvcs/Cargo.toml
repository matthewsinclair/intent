[package]
name = "intentsvcs"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Intent v3 services: the reified model, schema faces, SQLite store, sync and facade"
build = "build.rs"

[dependencies]
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true
jsonschema.workspace = true
async-graphql.workspace = true
rusqlite.workspace = true
ulid.workspace = true
uuid.workspace = true
time.workspace = true
thiserror.workspace = true
sha2.workspace = true
ignore.workspace = true
regex.workspace = true

[dev-dependencies]
testkit = { path = "../testkit" }
proptest.workspace = true
tempfile.workspace = true
# **TEST-ONLY, AND IT ADDS NO THIRD-PARTY CODE:** `rusqlite` is already a
# normal dependency of this crate, so this only makes it reachable from
# `tests/`, which cannot see a crate's own dependencies. AC-14.7's proof needs
# to break the store UNDERNEATH the facade -- dropping the `project` table so
# the watermark write fails -- and there is no honest way to do that through
# the public API, because the public API is what is under test.
rusqlite.workspace = true
