[workspace]
resolver = "3"
members = ["crates/intentsvcs", "crates/intent-cli", "crates/intentd", "crates/testkit"]

[workspace.package]
version = "3.0.0"
edition = "2024"
authors = ["Matthew Sinclair <hello@matthewsinclair.com>"]
license = "MIT"

[workspace.dependencies]
# The CLI surface. BUILDER api, not derive: the dispatch table is runtime
# data and IS the surface (AC-05.1), so the spine is constructed from it
# rather than declared twice.
# `string` is load-bearing, not a convenience: the surface is built from
# runtime table data, so every name is an owned String rather than a
# `'static` literal. Without it, clap can only accept the compile-time
# constants a derive-based spine would use -- which is the design AC-05.1
# rules out.
clap = { version = "4", features = ["string"] }
# The CORPUS rule (D29 / AC-03.7): a path git can never commit can never be
# canon. ripgrep's walker rather than a hand-rolled .gitignore parser, because
# gitignore is not a simple format -- nested files, negation, `**`, directory
# vs file semantics, .git/info/exclude, the global core.excludesFile -- and a
# partial reimplementation would silently disagree with git on exactly the
# edge cases that put a file back in scope.
# Its default `require_git(true)` is what gives the no-repo edge for free: with
# no repository there are no ignore rules, so the corpus degrades to
# everything-in-scope rather than to nothing.
ignore = "0.4"
# The headless critic executes a rule's admitted `Greppable proxy` pattern.
# **ALREADY IN THE GRAPH VIA `ignore`, so this direct dependency adds no new
# third-party code and no binary size** -- it makes an existing transitive
# compile unit reachable rather than pulling one in. v2 runs every proxy
# through `grep -nE` regardless of the line's own flags, so ERE is the target
# semantics rather than a convenient approximation of it.
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
# Ingest validation against the generated JSON Schema face -- ONE validation
# authority, so a hand-written check can never drift from the committed schema
# (design.md D05). `default-features = false` is load-bearing, not tidiness:
# the defaults pull reqwest + TLS and an HTTP $ref resolver, and a validator
# that can reach the network to resolve a schema is a validator whose verdict
# depends on the network. In-doc resolution only, per the stack shortlist.
jsonschema = { version = "0.49", default-features = false }
# The GraphQL SDL face (AC-02.2). The SDL is EXPORTED from the model types the
# same way the JSON Schema face is -- one authored master, three generated
# faces -- so async-graphql sits with the model in intentsvcs. The server that
# serves this schema is intentd's (D06); only the export lives here.
async-graphql = "7"
# The Highlander dependency: rusqlite is consumed by intentsvcs and NOWHERE
# else (design.md D06). dep_graph_guard.rs asserts this; adding it to another
# crate is a build-time architecture violation, not a style nit.
rusqlite = { version = "0.32", features = ["bundled"] }
ulid = "1"
# `project_id` (design.md D15 / the four cloud seams): a UUID stamped into
# `config.json` at migration, namespacing human-legible natural keys so that
# `(project_id, natural_id)` is the global identity.
#
# WHY A NEW DEPENDENCY WHEN `ulid` IS ALREADY HERE, which was the first thing
# checked. A ULID is also 128 bits and is already in the graph -- but it is not
# a UUID, and design.md says UUID twice while `ulid` is used in exactly one
# place (`event.rs`, envelope ids). Substituting one for the other silently
# would be a design change wearing a dependency decision's clothes.
#
# The randomness stack is NOT new: `getrandom` and `rand` are already in the
# lock via `ulid` and `rusqlite`, so what this adds is the uuid crate itself.
uuid = { version = "1", features = ["v4"] }

# ==========================================================================
# WP-08's STACK FIRSTS (AC-08.10). ALL ARE CONSUMED BY `intentd` ALONE.
# ==========================================================================
#
# **THE HEADING SAID `TWO` UNTIL 2026-08-30, AND THEN A THIRD ARRIVED.** That
# is the class this very block lectures about forty lines down -- *nothing in
# this file pins a count it could compute* -- committed by the heading over the
# argument. The count is however many declarations sit under this banner.
#
# **THIS WORKSPACE HAD NO ASYNC RUNTIME AND NO SERVER BEFORE THESE TWO.** Do
# not take that from this comment -- it is the kind of claim that is true when
# written and silently false later. Re-measure it:
#
#   grep -c '^name = "<crate>"$' Cargo.lock
#
# against tokio, axum, hyper, actix-web, async-std, smol, tower and notify.
# `async-graphql` was already here and pulled no runtime in, and still does
# not: its resolvers are async fns, which compile without one, and the only
# place that EXECUTES a document is intentd, on this runtime's handle -- the
# escape hatch ruling (vc, 2026-08-31). The CLI bridges to intentd or refuses.
#
# **THE CHOICE IS CITED, NOT RE-ARGUED, WHICH AC-08.10 EXPLICITLY PERMITS.**
# The sibling estate `../Conflab` runs exactly this pair in `conflabd`:
# `tokio` with `full`, and `axum` on a 127.0.0.1 management plane. That code
# is load-bearing and tested rather than a spike. Re-deriving a runtime choice
# from first principles here would produce a worse answer with less evidence
# behind it, and would invite a different answer in a third place.
#
# **D06 SURVIVES BOTH**: neither reaches the store. `intentd` still consumes
# no SQLite driver and talks to data only through the intentsvcs facade;
# `dep_graph_guard.rs` is what enforces that, and it is unaffected by these.

# WHY `full` RATHER THAN A MINIMAL FEATURE LIST, WHICH WAS THE FIRST THING
# CHECKED. **A narrow list would be a prediction about code that does not
# exist yet.** The daemon is unbuilt: AC-08.1, .2 and .4-.9 are all ahead, so
# any enumeration now is a guess about which of `net`, `signal`, `process`,
# `fs`, `time`, `sync` and `io-util` the finished thing reaches for -- and a
# guess wearing precision's clothes is worse than an admitted superset.
#
# **AND NARROWING LATER IS THE CHEAP DIRECTION, WHICH IS WHY IT WAITS.** A
# too-narrow feature list fails at COMPILE time, loudly, naming the feature;
# a too-wide one costs build time and nothing else. So the list can be
# DERIVED from the finished daemon rather than predicted before it -- which is
# the same reason nothing in this file pins a count it could compute.
tokio = { version = "1", features = ["full"] }

# The HTTP half of D56. `intentd` emits JSON only, over the socket AND over
# HTTP; axum serves the second, and the socket half needs no HTTP framework
# at all. **THE TWO TRANSPORTS HAVE DIFFERENT AUTHZ STORIES AND THE SEAM MUST
# NOT ASSUME OTHERWISE** -- filesystem permissions are the socket's authz, and
# the HTTP half carries one auto-generated token. Treating them uniformly
# gives the socket a check it does not need, or the port none at all, and the
# second is a hole.
#
# Version tracks the sibling rather than the newest release: `../Conflab`
# pins `axum = "0.8"`, and matching it means its `mgmt/` module is a worked
# example against the same API rather than an approximate one.
axum = "0.8"

# The filesystem watcher `AC-08.5` needs: *debounced gitignore-aware watching
# drives ingest on external edits*. **THE WORKSPACE HAD NO WATCHER BEFORE THIS
# -- re-measure rather than believe the sentence**, with the same
# `grep -c '^name = "<crate>"$' Cargo.lock` the two above name, against
# `notify` and `notify-debouncer-full`.
#
# **DEBOUNCED RATHER THAN RAW `notify`, WHICH design.md:83 REQUIRES AND WHICH
# IS NOT A PREFERENCE.** One editor save is a BURST -- a write, an attribute
# change, sometimes a chmod -- and an ingest is one whole transaction over the
# project's scanned corpus. Acting on raw events would run a full ingest per
# event, so saving one file ingests the estate three or four times, and under a
# formatter or a `git checkout` it does so hundreds of times while the tree is
# still moving underneath it. Debouncing is what makes the trigger correspond
# to *somebody finished editing* rather than to *the kernel noticed something*.
#
# **`-full` RATHER THAN `-mini`, AND THE REASON IS THE COMMONEST EDITOR
# BEHAVIOUR ON THIS ESTATE.** Full tracks file identity, so a write-to-temp-
# and-rename -- what vim and every atomic-save editor actually does -- arrives
# as a RENAME. Under `-mini` the same save arrives as a delete followed by a
# create, so a watcher that believes what it is told sees a file disappear
# every time somebody saves it. The difference costs one small crate and
# removes a class of wrong answer rather than a class of noise.
#
# **THE `ignore` HALF OF design.md:83 ADDS NOTHING HERE, DELIBERATELY.**
# Gitignore-awareness is SCOPE, scope belongs to the sync engine, and
# `intentsvcs::sync::Scanned` is the one predicate both the walk and the
# watcher ask -- so `intentd` reaches the ignore rules through `intentsvcs`,
# which already pins `ignore` above with its own argument. **A second statement
# of scope inside the daemon would drift in the direction that loops**: the
# store lives at `intent/.cache/intent.db`, INSIDE the watched tree, and every
# ingest writes it.
#
# **DEFAULT FEATURES, WHICH IS `macos_fsevent` HERE.** The alternative backend,
# `macos_kqueue`, needs one file descriptor per watched file; a project tree
# exhausts the per-process limit, and that failure arrives as events silently
# stopping rather than as an error.
#
# **D06 SURVIVES**: a watcher reaches no store. It reports paths, and the
# ingest it triggers goes through the facade like everything else in `intentd`.
notify-debouncer-full = "0.7"
time = { version = "0.3", features = ["formatting", "macros"] }
# Content hashing for the sync engine's file index. AC-03.3 requires detecting
# a same-size same-mtime rewrite, which stat cannot see by construction, so the
# hash is computed on EVERY scan and stat is reporting metadata only.
sha2 = "0.10"
thiserror = "2"
proptest = "1"
tempfile = "3"

# Release profile for the SHIPPED binaries (WP-11, dc 2026-08-15). Measured on
# this workspace rather than copied from a blog post -- four cold builds, same
# source, same machine:
#
#   variant                          build   intent      vs base   nm symbols
#   A  cargo defaults                 31s    9,949,792     --        --
#   B  thin-lto cgu=1 strip=debug     35s    8,506,784   -14.5%      --
#   C  fat-lto  cgu=1 strip=symbols   48s    7,096,576   -28.7%      144
#   D  fat-lto  cgu=1 strip=debug     51s    8,084,128   -18.7%   10,064
#
# D IS THE CHOICE, AND C IS THE ONE IT BEATS ON A RULE RATHER THAN A PREFERENCE.
# The only difference between them is the symbol table: it costs 987,552 bytes
# -- 988 KB, on a binary a user downloads once -- and it buys 10,064 named
# frames instead of 144. `strip = "symbols"` ships a tool that panics into hex
# addresses, so the failure surfaces and says nothing, which is IN-AG-NO-SILENT-
# 001 satisfied in the letter and lost in the substance. A megabyte is not worth
# that trade for a CLI whose entire error posture is "every failure surfaces
# with a remedy".
#
# `panic = "abort"` was considered and REJECTED: it is another size win and it
# changes error semantics, which is not a thing to alter for bytes.
#
# The build cost is +20s over baseline and it is paid in CI at tag time, never
# in the dev loop -- and it does NOT touch `target/debug`, so nobody sharing
# this tree pays a rebuild for it.
[profile.release]
lto = "fat"
codegen-units = 1
strip = "debuginfo"
