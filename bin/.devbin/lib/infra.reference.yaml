# devbin infra.yaml -- annotated reference
#
# The profile: one file holding everything `devbin infra` knows about an estate.
# devbin ships no estate of its own and never will -- a profile is data you
# supply, and the profile is an ARGUMENT rather than a location, so it can
# live inside a project, outside one, or be handed in by CI.
#
# WHERE IT IS LOOKED FOR, in this order:
#
#   --profile <path>
#   $DEVBIN_INFRA_PROFILE
#   <project root>/infra.yaml
#   ~/.config/devbin/infra.yaml
#
# A MISS IS A HARD FAILURE NAMING EVERY PATH TRIED. Never a default, never an
# empty estate, never a silent skip: an infra command that finds no profile and
# reports nothing wrong is exactly the false green this framework refuses.
#
# GRAMMAR. The same restricted YAML subset every devbin config uses, read by the
# same `lib/config` (design D7), so the same forms are refused with the same
# line-naming errors:
#
#   yes   two-space indent, nested maps, `key: value`, scalar sequences
#         (`- item`), `#` comments, quoted scalars, blank lines, `---`
#   no    tabs, odd or jumped indent, duplicate keys, anchors/aliases (& *),
#         block scalars (| >), flow collections ({ [), sequences of maps, a
#         key indented under a key that already has a value
#
# EVERYTHING BELOW IS BLOCK FORM, AND THAT IS A CONSTRAINT RATHER THAN A STYLE.
# `dmarc: { policy: none }` and `senders: [mailersend]` are refused at parse
# time. Until 2026-09-07 the worked example lived in a prose document and was
# written in three forms this parser rejects -- flow collections, flow
# sequences, and a `domains:` map keyed by FQDN instead of by handle. It was the
# first thing a new reader would copy and it could not load, and no test noticed
# because no test read it. THIS FILE IS PARSED BY THE SUITE ON EVERY RUN
# (tests/unit/infra-profile.bats), which is the only assertion that cannot rot:
# a test grepping for forbidden punctuation would pass the day somebody invented
# a fourth way to write it wrong.
#
# WHAT BELONGS IN A PROFILE, and it is one rule rather than a list:
#
#   A field belongs in the profile if and only if `check` can go red on it.
#
# `ttl: 300` is an ASSERTION compared against truth on every run, so it belongs.
# Authoritative nameservers are an INPUT -- the value lookups run THROUGH -- so
# nothing could ever compare them to anything, and declaring them would create a
# second source of truth free to drift: profile says one registrar, the domain
# moved, and every subsequent "authoritative" read is a lie.
#
# An earlier form of the rule read `could devbin discover it? then it does not
# belong`, which also deletes `ttl`, every SPF include and the DMARC policy.
# Discoverability was never the discriminator. Being checkable is.
#
# EVERY KEY IN A PROFILE IS ONE THIS FILE SHOWS, AND ANY OTHER IS REFUSED --
# before a single record is read, naming the key and the file. A key written
# where nothing reads it, like `dmarc: none` under `defaults:`, is refused the
# same way. Until issue 0143 such a key parsed and was simply never read, and a
# profile declaring a DMARC sp=, a second DKIM key and a wildcard checked green
# against a zone carrying none of them. A key written with NO value is refused
# too, wherever it is written: the reader cannot see it at all, so it is not an
# empty entry but an absent one.

# The schema version, so a later shape can be told from this one. `infra init`
# writes 1; nothing reads it yet, so a profile without it is not refused.
version: 1

# A label for the estate, printed by `show` and `check` -- `(unnamed)` when
# absent. Two profiles are two files with two names.
name: example

# --- defaults, inherited by every domain ------------------------------------
#
# Only genuine differences are spelled per domain. A handle carrying nothing but
# its `name:` inherits all of this.
defaults:
  mail: google
  ttl: 300
  dmarc:
    policy: none
    rua: dmarc@example.com
  # --- manual: what SHOULD be true and can never be verified -----------------
  #
  # A `manual:` entry is free text in its own namespace, inherited like anything
  # else under `defaults:` and overridden by name under a domain's own `manual:`.
  # EVERY ONE IS NAMED ON EVERY RUN AND NONE OF THEM IS EVER CHECKED, which is
  # the whole reason the namespace exists: an entry records a state devbin has no
  # way to observe, so it cannot detect that the state stopped being true. Keeping
  # them apart from the checked keys is what stops a reader taking the block as a
  # record of verification -- the same failure as a disarmed guard that reports
  # nothing, arrived at from the other direction.
  #
  # Undocumented here until 2026-09-22 although `infra_manual_keys` has read both
  # `defaults.manual` and `domains.<handle>.manual` throughout. An honoured key
  # absent from the one annotated guide an operator has is the same defect as a
  # documented key that does nothing, and this file is VENDORED, so the omission
  # reached every estate.
  manual:
    registrar: locked at the registrar; transfer auth off

# --- senders: a matched pair, declared once ---------------------------------
#
# A third-party sender is a matched pair of an SPF include and its DKIM
# records, AND THE PAIR IS THE UNIT. Naming it once means a domain cannot
# acquire half of it -- SPF authorising a sender with no DKIM to match makes
# that domain's own legitimate mail bit-for-bit indistinguishable from a
# forgery of it, and it is silent until the first message flows.
#
# THE VALUES LIVE HERE, IN YOUR PROFILE, AND NEVER IN DEVBIN. devbin ships the
# pair's SHAPE and never its contents: a vendor's published include is often
# account-specific, so a shipped value is a confidently-wrong assertion -- a
# check whose target was never the right target. Measured on a real estate,
# where two domains on one vendor account carried disjoint includes.
#
# ONE DKIM RECORD OR SEVERAL. A sender publishing one record writes its fields
# directly under `dkim:`, as `newsletter` does below. A sender publishing more
# writes each under a label of your choosing, as `mailersend` does: it moved on
# 2026-09-08 from one record to two, ms1 and ms2, and rotates between them. A
# domain naming the sender must then carry EVERY record it declares, and check
# asks for each on the domain's own nameserver and names each one missing as a
# HALF PAIR. Each record takes the same three fields in both forms: `name` (the
# name under the domain), `type` (CNAME when not given) and `value` (optional,
# compared when given). The value is compared WHOLE with every record at that
# name, so a second record there is drift, and so is a target the value is only
# part of. A CNAME target is compared as a name, ignoring case and the root
# dot; a TXT record as a resolver sees it, its strings joined. Refused before
# anything is read: the two forms in one sender,
# a label spelled `name`, `type` or `value`, two records naming one selector,
# and a record with no name.
#
# check cannot tell a sender declared with FEWER records than its vendor
# publishes: a DKIM selector cannot be listed from DNS, and devbin ships no
# vendor table. Declaring every record is the profile's job.
#
# A sender is declared once per profile, so two domains at different stages of
# a vendor's move need two senders with the same spf_include.
senders:
  newsletter:
    spf_include: _spf.newsletter.example
    dkim:
      name: nl1._domainkey
      type: CNAME
      value: nl1._domainkey.newsletter.example
  mailersend:
    spf_include: _spf.mailersend.net
    dkim:
      ms1:
        name: ms1._domainkey
        type: CNAME
        value: ms1._domainkey.mailersend.net
      ms2:
        name: ms2._domainkey
        type: CNAME
        value: ms2._domainkey.mailersend.net

# --- domains: a map from HANDLE to a block carrying name: --------------------
#
# THE FQDN IS A FIELD, NOT THE KEY, and the handle is a short label you choose.
# Two handles naming one FQDN is REFUSED: they can carry contradictory
# expectations that `check` would evaluate against the same live records, so one
# goes green and one goes red on the same domain and ordering decides which you
# read.
#
# `senders: []` is never written -- only the non-empty case.
domains:
  example:
    name: example.com

  partner:
    name: partner.example
    senders:
      - mailersend
      - newsletter
    # sp: THE POLICY FOR SUBDOMAINS, the _dmarc record's sp= tag, beside the
    # policy it would otherwise follow. It is compared with the live sp=, or,
    # when the record carries none, with its p=: an absent sp= means the
    # subdomain policy IS p= (RFC 7489), and the drift line says which value it
    # compared. Undeclared, nothing about sp= is asserted.
    #
    # INHERITED PER KEY, like every field under `defaults:`. A domain that
    # overrides `policy` alone keeps the defaults' `sp` -- the record's own rule,
    # an absent sp= following p=, is NOT the profile's. An `sp` with no policy in
    # force is refused, since only the policy asserts that the record exists.
    # `policy` and `sp` take none, quarantine or reject.
    dmarc:
      sp: reject
    # wildcard: THE RECORDS AT `*.<domain>`, read on the domain's own
    # nameserver: `a`, `aaaa` and `txt`, each ONE value, compared as the whole
    # set of that type, so an extra address, or a second TXT record, is drift.
    # Two addresses written in one value are refused before anything is read.
    # An address is written as dig prints it; a TXT is compared with its
    # strings joined; the ttl is checked. Inherited per key from `defaults:`
    # like the rest.
    #
    # A wildcard answers only for names that do not exist. The apex always
    # exists, so no check at the apex changes. A DKIM record's name can be one
    # that does not exist, though: with no `_domainkey` name under the domain, a
    # wildcard TXT answers for a missing TXT-type DKIM record, which then reads
    # as present. A CNAME-type record is not affected.
    wildcard:
      a: 192.0.2.10
      aaaa: 2001:db8::10
      txt: "v=spf1 -all"

  legacy:
    name: legacy.example
    mail: other
    # A DELIBERATE OPT-OUT, AND IT MUST BE SPELLED, never achieved by omission.
    # Omission means inherit. A domain outside the reporting estate has to be a
    # decision somebody typed, because the alternative is a domain that can be
    # forged, will never generate a report saying so, and looks identical to a
    # domain that is simply quiet.
    dmarc: none
    # `none` HERE IS A VERIFIED ABSENCE, NOT AN OPT-OUT: check reads each type
    # at `*.legacy.example` and goes red on any record there, and on a CNAME
    # there, which answers for every type. Where `dmarc: none` is named on every
    # run and never checked, this is checked on every run.
    wildcard:
      a: none
      aaaa: none
      txt: none

# --- runtime: omitted entirely by an estate that does not use Fly ------------
#
# No command reads this block yet: `check` covers DNS and mail only, and the
# Fly runtime leg is devbin's ST0006, not built.
runtime:
  fly:
    example-app:
      org: example
      hostnames:
        - example.com
        - app.partner.example

# --- unreviewed: deviations are STRUCTURAL, never commentary -----------------
#
# `infra init` emits anything it could not confidently propose into this block,
# and `check` REFUSES TO RUN while it holds any entry. Not a warning, and not
# "mostly reviewed": five deviations reviewed down to one is still an estate
# with an unratified target.
#
# Accepting a deviation means DELETING A KEY, which is an act. Leaving it as a
# comment would make acceptance an omission -- and comments are the least
# durable content in any config file, stripped by formatters, folded by editors,
# lost on regeneration. A generated profile whose only guard rail is a comment
# is an automated false green waiting for its first skim.
#
# Absent when there is nothing outstanding, which is the normal state. Shown
# here commented out because a reference carrying a live entry would refuse to
# check.
#
# unreviewed:
#   ttl: "nothing proposed: ... Live: [300: example partner] [900: legacy]"
#   legacy_dmarc: "carries MX and NO _dmarc record; its target inherits p=none"
