# intent -- devbin configuration.
#
# Written by: devbin install. Every key, annotated, is vendored beside this
# file at bin/.devbin/lib/config.reference.yaml.

project:
  name: intent

  # THERE IS NO `bin/intent` SYMLINK AND THERE MUST NEVER BE ONE.
  #
  # `intent` is the product's own binary name -- the native CLI this project
  # builds and ships. A devbin launcher of that name would shadow the product
  # binary, which is exactly the collision that retired the `bin/{project}`
  # convention estate-wide (Lamplight ships a `lamplight`; this project ships an
  # `intent`).
  # `name: intent` above is this project's identity, never an instruction to
  # create a symlink.
  #
  # hv RATIFIED THE CONVENTION 2026-08-27: the shim in a project is always
  # `bin/devbin`; a project MAY add a 2-3 character shortcut symlink to it by its
  # own choice; and tools and process always use `bin/devbin`, never the
  # shortcut. `int` below is that optional shortcut and it does NOT retire.
  #
  # THREE CLAIMS THAT STOOD HERE WERE FALSE BY 2026-08-27 AND ARE RECORDED SO
  # NOBODY RESTORES THEM FROM MEMORY:
  #
  #   1. "devbin doctor reports its absence as a note" -- it does not. doctor
  #      only comments on a symlink that EXISTS and pointedly says a real file of
  #      that name is the project's own binary and none of devbin's business.
  #      Driven: `bin/devbin doctor` says nothing about `bin/intent` at all.
  #   2. "`link_alias` refuses to replace a real file" -- `link_alias` is GONE,
  #      deleted outright rather than guarded, so the protection is now
  #      structural rather than conditional. See lib/cmd/install.
  #   3. "when the v2 CLI is retired, `bin/intent` frees up and `link_alias`
  #      will create it on the next install" -- THIS WAS THE DANGEROUS ONE. It
  #      told a future maintainer to EXPECT the collision above, in the one
  #      estate whose product binary is called `intent`. The v2 CLI has since
  #      been removed from this tree, and nothing creates `bin/intent`.
  #
  # `int` rather than the estate's usual 2-letter alias: `in` is a bash reserved
  # word. Driven 2026-08-27, and the claim is narrower than it was written: bare
  # `in test all` is rc=2 in bash and rc=0 in zsh, so it fails only when invoked
  # BARE. Path-qualified `bin/in test all` is rc=0 in BOTH shells, which is how
  # shortcuts are always invoked -- so `in` was in fact available. `int` works,
  # is what everything already types, and there is no reason to move.
  alias: int

  # WHICH TREE DID THIS VERDICT DESCRIBE. devbin runs this once at process
  # start and prints its stdout beside every `verdict:` and beside the `all`
  # summary. It never parses the string -- it cannot tell a sha from a
  # hostname, and that ignorance is the layer boundary, not an oversight.
  #
  # The whole reason this is a config key rather than a variable exported from
  # `bin/devbin` is that `bin/devbin` is DEVBIN'S file (it is listed in
  # bin/.devbin/manifest.sha256). It was
  # wired there first, and `int vendor` reported it DIVERGED on the very next
  # run -- the vendoring check catching a fork of the dispatcher by the person
  # who had just quoted the ownership rule at himself. `config.yaml` and `cmd/`
  # are ours; this uses both and leaves the vendored tree stock.
  #
  # Several nodes commit into one clone here, so the interval between a compiler
  # reading a file and a human reading the verdict routinely contains someone
  # else's edits. A verdict that has outlived its tree is indistinguishable, by
  # inspection, from a verdict about landed code.
  referent: bin/.devbin/cmd/measured --value

  # The files that MIRROR the version. `version set|bump|sync` writes each of
  # them; `version check` reports any that have drifted.
  #
  # `version_from` IS DELIBERATELY NOT DECLARED. It defaults to `VERSION`, which
  # is what this project uses, and the header rule holds: config carries the
  # DIFFERENCES from the catalogue, never a second copy of it. But the fact
  # still has to be STATED somewhere, because here it is counter-intuitive --
  # `VERSION` is the source and `native/rust/Cargo.toml` is the mirror, even
  # though the Cargo.toml is the one the shipped binaries actually read.
  #
  # THAT INVERSION IS WHY THIS BLOCK EXISTS AT ALL. Every crate takes
  # `version.workspace = true`, and both binaries compile their version string
  # from `env!("CARGO_PKG_VERSION")` -- so the number on `intent --version`, and
  # on the page intentd serves, comes from the Cargo.toml and not from VERSION.
  # Nothing held the two equal outside a release cut. Until this landed,
  # `version check` answered `version: 3.0.0, every sidecar agrees` at rc=0 over
  # an EMPTY list: green because it examined nothing, which is worse than
  # absent -- it actively answers the question it is not asking.
  #
  # OTHER FILES HOLD THE VERSION AND ARE DELIBERATELY OUT. Each is out for its
  # own reason, and none of them is an oversight:
  #
  #   native/rust/Cargo.lock -- devbin refuses a lockfile BY NAME, because no
  #     generic recipe can know which `[[package]]` entries are this project's
  #     own (lib/cmd/version), and the core syncs a lock only where
  #     project.version_from is a Cargo.toml. Ours is synced by the cut's
  #     `stamp lock` (bin/.devbin/cut/stamp), which asks cargo to do it and then
  #     refuses any change beyond the workspace members' versions.
  #
  #   native/macos/Intent/Intent/Info.plist -- it holds `$(INTENT_VERSION)`, an
  #     Xcode build-setting reference, NOT a literal. devbin's PlistBuddy recipe
  #     would replace that reference with a number and silently un-wire the app
  #     from its build settings. Conflab DOES declare its plist and this is not
  #     a divergence from Conflab: the difference is the FILE, not the
  #     convention -- Conflab's holds a literal. Do not add ours by symmetry.
  #
  #   intent/.config/config.json -- `intent_version` is Intent's self-hosting
  #     stamp. devbin has no recipe for it (`config.json` is not
  #     `package.json`), so it falls to the bare-version default, which
  #     `assert_bare_version_sidecar` refuses rather than overwriting the whole
  #     file. Driven, not assumed: declaring it makes `version sync` die with
  #     "cannot write the version into intent/.config/config.json", and the
  #     preflight pass means nothing else is written either. The cut's
  #     `stamp config` writes it with `stamp_project_version`
  #     (shared/releasestamp.lib), and `intent upgrade` stamps it on an upgrade.
  #
  # AGENTS.md and CLAUDE.md carry a `Generated by Intent vX.Y.Z` banner and are
  # not homes either: they are DERIVED, regenerated from the config stamp above
  # by `intent agents sync` and `intent claude upgrade --apply`. The cut's
  # `stamp agents` and `stamp upgrade` run them, and refuse if either fails.
  version_sidecars:
    - native/rust/Cargo.toml

  # shell: the bats suite and the shell critic are both real gates here.
  # rust: the ST0056 native binary -- the reason devbin is in this project.
  languages:
    - shell
    - rust

# The devbin this project expects. Enforced by: devbin doctor
devbin_version: "^0.1.0"

# EVERY `run:` LINE BELOW IS WRAPPED IN `bin/.devbin/cmd/measured --exec`, WHICH
# PRINTS ONE LINE AND THEN BECOMES THE COMMAND. That line records the commit and
# the clean/dirty state AT RUN START, so the run log names the tree its verdict
# describes. Without it a run over a dirty worktree and a run over a clean
# checkout produce artefacts identical in form and incomparable in meaning --
# measured here on 2026-08-17, when several sessions went into establishing that
# the red legs were not regressions, and GREEN legs from the same run certified a
# tree nobody had.
#
# A WRAPPER, AND NOT SOMETHING PRETTIER, BECAUSE `run:` IS WORD-SPLIT AND
# DELIBERATELY NOT `eval` (lib/resolve). `;` and `&&` arrive as literal argv, so
# a two-command line is not expressible here; devbin's own comment states the
# rule -- a command line that needs real quoting needs a handler. `--exec` is
# that handler, kept to one job.
#
# IT LIVES IN THE PROJECT, NOT IN DEVBIN. Intent knows it is a git checkout;
# devbin does not, and must not have to -- devbin echoes the referent string and
# never composes or parses one. (devbin's lib/ does call git for other jobs, so
# the boundary is the layer, not an absence of git from the vendored tree.)
#
# ADDING A GATE? Wrap it too. The stamp reaches only `run:` lines, so the
# catalogue builtins (`check critic`, `check toolchain`, `check autotests`,
# `check targetdir`, the docs gates, `fmt md`) record nothing. `int measured`
# prints NONE RECORDED for those rather than omitting them, because an unstamped
# run must never read like a run that started clean.
commands:
  test:
    options:
      shell:
        # NOT the catalogue's `bats tests`. That is non-recursive and this
        # project's suites live under tests/unit/, so it found nothing and
        # `test all` went red on an empty suite. The project runner
        # (tests/run_tests.sh) also exports BATS_LIB_PATH, which every suite
        # needs to load its helpers, and INTENT_HOME -- raw bats would find
        # the files and then fail them. It runs each directory of suites
        # through devbin's lanes runner (devbin issue 0339, ST0093 WP-06).
        summary: the BATS suite in devbin's two lanes, via the project runner (exports INTENT_HOME + BATS_LIB_PATH)
        run: bin/.devbin/cmd/measured --exec tests/run_tests.sh

      # THE CARGO WORKSPACE IS NOT AT THE PROJECT ROOT, AND THE CATALOGUE
      # ASSUMES IT IS. Every catalogue-derived cargo line -- `test rust`,
      # `check clippy`, `fmt rust`, and the `check format` builtin's rust arm --
      # runs in a subshell at PROJECT_ROOT (lib/resolve, and that is the right
      # default: a declared `run:` is a project command and belongs at the root).
      # Since a1a949c moved all native code to native/rust/ there is no
      # Cargo.toml there, so each died with `could not find Cargo.toml`.
      #
      # THE ROOT MANIFEST IS NOT COMING BACK. It is what the move deleted, and
      # cmd/prepush now REFUSES a push that reintroduces a second workspace
      # manifest outside crates/. `--manifest-path` is cargo's own answer to
      # "the workspace is not where you are standing" and needs no cd.
      #
      # These read verbatim like .github/workflows/rust.yml, which sets
      # `working-directory: native/rust` and was updated by the move while these
      # were not. Same checks, two homes, one of them followed the move --
      # so keep the flags identical and the drift stays visible.
      rust:
        summary: the workspace suite (native/rust -- the catalogue assumes a root manifest)
        # `--no-fail-fast` because WITHOUT IT ONE EARLY FAILURE ABORTS EVERY
        # REMAINING TARGET while the run still prints a total that reads like a
        # whole-workspace number. conflab-vc measured it on their own tree
        # (2026-08-10): a lib-target failure left most targets unrun and the
        # suite reported a total short of what the crate holds. This workspace
        # was exposed further and nobody here had checked. Kept identical to
        # .github/workflows/rust.yml per the note above, so the drift stays
        # visible.
        run: bin/.devbin/cmd/measured --exec cargo test --workspace --no-fail-fast --manifest-path native/rust/Cargo.toml

      # THE ARMS THAT NEED A REAL TOOLCHAIN, AND DELIBERATELY NO CI TWIN (hv,
      # 2026-09-17). An arm that spawns rust-analyzer or compiles an Elixir
      # fixture is `#[ignore = "needs <tool> on PATH; bin/devbin test all runs
      # it"]` under a module path containing `needs_the_toolchain`, so `rust`
      # above never runs it and CI stays hermetic. This line is where such an arm
      # runs: the same cargo invocation as `rust`, taking only the ignored arms
      # with that name. `test all` runs every declared option, so it follows
      # `rust` there. An arm fails by name when its tool is absent and never
      # skips, so a green here means the toolchain was on PATH.
      #
      # NOT `check toolchain`, which compares the .tool-versions pin.
      toolchain:
        summary: the ignored arms that need a real toolchain on PATH (needs_the_toolchain; no CI twin)
        run: bin/.devbin/cmd/measured --exec cargo test --workspace --no-fail-fast --manifest-path native/rust/Cargo.toml -- --ignored needs_the_toolchain

  check:
    options:
      clippy:
        # `--manifest-path` before the `--`; everything after it is rustc's.
        summary: clippy over the whole workspace, warnings as errors
        run: bin/.devbin/cmd/measured --exec cargo clippy --workspace --all-targets --manifest-path native/rust/Cargo.toml -- -D warnings

      # THE TWIN OF rust.yml's IN-RS-CODE-001 STEP, AND IT EXISTS BECAUSE THE
      # TEST THAT DEMANDS IT WENT RED ON MAIN. `ca3edf2ad` added the CI step and
      # no twin here, so the `tests/unit/devbin_rust_gates.bats` test "every cargo check CI runs has a devbin twin with the same flags"
      # has failed since that commit. The fix is the twin and never an exception in the
      # test: two homes for one check, one of them following the tree, is the
      # exact defect that file exists to catch.
      #
      # NARROWER THAN `clippy` ABOVE ON PURPOSE, AND THE NARROWING IS CI'S
      # RATHER THAN OURS. `--lib` and the two named packages keep the three
      # restriction lints off tests, examples and benches, where `unwrap()` in a
      # fixture is the right code; the build scripts stay out behind a
      # crate-level allow, because a build-script panic fails the build the way
      # main.rs exits (vc, 2026-09-15). The flags are COPIED from rust.yml and
      # not re-derived: that test compares the two command lines after stripping
      # `--manifest-path`, so drift on either side goes red instead of silent.
      #
      # `log:` IS DECLARED AND IT IS LOAD-BEARING, WHICH THE NEIGHBOURS DO NOT
      # SHOW YOU. `grammar:` is read only on the sealed path (lib/resolve reads
      # it, then gates the whole run_gate call on a non-empty suffix), and a
      # suffix is inherited from the catalogue only for a name the catalogue
      # KNOWS. `clippy`, `format` and `toolchain` in this block are catalogue names and
      # inherit both; `doc` is a project invention and runs bare. This option is
      # a project invention too, so without `log:` it would run bare and
      # `grammar: cargo` would be dead config -- the ST0002 WP-08 shape
      # lib/resolve warns about: right exit code, no seal to read. `log: true`
      # takes the suffix from the option name, so the pair is tmp/check/*.PANICS.
      panics:
        summary: the panic-path restriction lints CI runs (unwrap_used, expect_used, panic), over the intentsvcs and intent-cli libraries
        log: true
        grammar: cargo
        run: bin/.devbin/cmd/measured --exec cargo clippy -p intentsvcs -p intent-cli --lib --manifest-path native/rust/Cargo.toml -- -D clippy::unwrap_used -D clippy::expect_used -D clippy::panic

      # CI'S TWO STEPS ADDED BY ISSUE 0649, COPIED FLAG FOR FLAG, and declared with
      # `log:` for the reason `panics` gives above. `panics-intentd` reaches the
      # binary the library step cannot, since intentd has no library target;
      # `ownership` is IN-RS-CODE-002's stable lint over library and binary code.
      panics-intentd:
        summary: the panic-path restriction lints CI runs (unwrap_used, expect_used, panic), over intentd's binary
        log: true
        grammar: cargo
        run: bin/.devbin/cmd/measured --exec cargo clippy -p intentd --bins --manifest-path native/rust/Cargo.toml -- -D clippy::unwrap_used -D clippy::expect_used -D clippy::panic
      ownership:
        summary: needless_pass_by_value over the workspace's library and binary code, as CI runs it (IN-RS-CODE-002)
        log: true
        grammar: cargo
        run: bin/.devbin/cmd/measured --exec cargo clippy --workspace --lib --bins --manifest-path native/rust/Cargo.toml -- -D clippy::needless_pass_by_value

      # DECLARED BECAUSE `fmt rust` IS DECLARED, and devbin will not let it be
      # otherwise: builtin_check_format REFUSES a language whose `fmt` arm the
      # config has overridden, rather than verifying a command line the
      # formatter no longer runs. Loud by design -- follow its instruction.
      #
      # THE COST, WHICH IS REAL: this replaces the whole multi-language builtin
      # with one command line. Today `languages: [shell, rust]` and shell has no
      # formatter arm, so rust IS the entire check and this is equivalent. ADD A
      # THIRD LANGUAGE AND ITS FORMAT CHECK SILENTLY DOES NOT HAPPEN. The
      # tripwire is in tests/unit/devbin_rust_gates.bats, which pins the
      # declared language set for exactly this reason.
      format:
        summary: rustfmt over the workspace, non-mutating
        run: bin/.devbin/cmd/measured --exec cargo fmt --all --manifest-path native/rust/Cargo.toml --check

      # GATES, AS CI DOES, AND IT WAS REPORT-ONLY UNTIL ISSUE 0501. Bare `cargo
      # doc` warns on a broken intra-doc link and still exits 0, so this option
      # ran without RUSTDOCFLAGS and reported. CI's doc step gated from issue
      # 0451 on, under `-D warnings`, and the twin test compared `run:`
      # lines only, so the two homes disagreed with nothing reporting it: the
      # 3.2.0 tag passed `int check doc` while CI's doc step was red on it.
      #
      # `env RUSTDOCFLAGS=-Dwarnings`, THE SAME BYTES AS rust.yml's `env:`. A
      # `run:` line is word-split and never eval'd, so `-D warnings` with its
      # space cannot be written here; CI moved to the spelling this line can
      # carry, rustdoc reads both as one flag, and tests/unit/devbin_rust_gates.bats
      # now compares the env as well as the command.
      #
      # THE BLANKET -D IS CI'S DECISION, NOT THIS FILE'S. This comment used to
      # argue for denying only `rustdoc::broken_intra_doc_links`; a twin that is
      # narrower than CI is the drift the test exists to catch, so the scope of
      # the flag is ruled in rust.yml and followed here.
      #
      # THE CUT RUNS IT (`bin/devbin gate rust`, in release.gates; issue 0501),
      # with `format`, `clippy` and `panics` above, so a cut that passes its gates
      # has passed every cargo step of rust.yml. The workflow's three setup steps
      # (the toolchain record, shellcheck, prettier) are not cargo steps, and the
      # gate does not run them.
      doc:
        summary: rustdoc over the workspace, warnings as errors (as CI's doc step)
        run: bin/.devbin/cmd/measured --exec env RUSTDOCFLAGS=-Dwarnings cargo doc --no-deps --document-private-items --manifest-path native/rust/Cargo.toml

      # ON, AND GREEN FOR A STATED REASON RATHER THAN OFF. hv ruled 2026-08-19:
      # Intent does NOT pin its toolchain -- "we're not using asdf, mise, or
      # anything like that here, and I don't want to impose anything like that on
      # a user". So the answer was never to add a `.tool-versions`; it was that a
      # project legitimately declaring no pin must not read as a violation.
      #
      # This was `enabled: false` from 2026-08-16, because `int check all` was
      # permanently red on a missing `.tool-versions` -- and a permanently-red
      # aggregate is worse than a slow one: a slow gate gets bypassed, an
      # always-red gate gets ignored, and the real failure hides in the noise.
      # Disabling it stopped the noise and left a gate switched off, which is a
      # state nobody reviews. Now the gate RUNS and reports "no .tool-versions --
      # this project declares no toolchain pin".
      #
      # THE FIX LANDED UPSTREAM. The defect was devbin's rather than Intent's --
      # the function already report-and-passed on a `.tool-versions` that pins
      # NOTHING while it `die`-d on the file being absent, so one gate answered
      # "this project declares no pin" two opposite ways depending on how the
      # project expressed it. The vendored `lib/cmd/check` now reports the
      # absent file the same way, and `int vendor` reports no local patch.
      #
      # The neighbouring decision is unchanged and still recorded in
      # .github/workflows/rust.yml: NO rust-toolchain.toml, because rustup is not
      # installed here and rustc is Homebrew's, so such a file is ignored in
      # silence -- a pin that does not bind is worse than no pin, because it does
      # not refuse and it misleads. CI no longer floats on @stable: every
      # workflow installs the fleet's Homebrew rustc, its version written once in
      # .github/actions/fleet-rust/action.yml (hv, 2026-11-13), so `fmt --check`
      # and `clippy -D warnings` move in CI only when that line moves with brew.
      toolchain:
        enabled: true

  fmt:
    options:
      # `--all` IS LOAD-BEARING AND ITS ABSENCE FAILS IN THE DIRECTION THAT
      # LOOKS LIKE A FINDING. native/rust/Cargo.toml is a VIRTUAL manifest (no
      # root package), so `cargo fmt --manifest-path <it>` reports
      # `Failed to find targets` and exits 1 -- indistinguishable at the exit
      # code from "found unformatted files". Measured, not assumed: with --all
      # this covers the same files as CI's invocation, set-for-set.
      rust:
        summary: rustfmt over the workspace, in place
        run: bin/.devbin/cmd/measured --exec cargo fmt --all --manifest-path native/rust/Cargo.toml

  build:
    group: Build
    # Every arm (all, cli, daemon) is a handler under cmd/build.d/, not a `run:`
    # line: each sources shared/releasebuild.lib, whose guards decide where a
    # release build may land, and a `run:` line carries none of that. `bin/devbin
    # build --help` lists them; `bin/devbin help build` does not, because help
    # enumerates only declared options. A release is cut by devbin's core
    # (`bin/devbin release vX.Y.Z`), and no arm here cuts one.

  # THE CUT'S OWN STAGES (ST0091 WP-01). devbin's release core runs the cut, and
  # these are what it asks of this project: `preflight` at its pre-flight seam
  # as `release.preflight` (devbin 0327), and `stamp` as `release.derived`.
  # Each option runs one step of bin/.devbin/cut/<command>, which says what
  # the step reads, writes and prints. Declared options rather than a handler in cmd/: a handler shadows
  # every declared option (lib/resolve), so help would not list the steps.
  # `all` is synthesised from each list and runs it in this order.
  preflight:
    group: Release
    summary: The cut's read-only checks, before anything is stamped
    options:
      clean:
        summary: no dirty or untracked path, while no stamp has begun
        run: bin/.devbin/cmd/measured --exec bin/.devbin/cut/preflight clean
      daemon:
        summary: no intentd running, since the cut replaces the pair it executes
        run: bin/.devbin/cmd/measured --exec bin/.devbin/cut/preflight daemon
      faces:
        summary: the schema faces at HEAD carry HEAD's version
        run: bin/.devbin/cmd/measured --exec bin/.devbin/cut/preflight faces
      spill:
        summary: claude upgrade --apply would write nothing outside the release's files
        run: bin/.devbin/cmd/measured --exec bin/.devbin/cut/preflight spill

  # THE STAMP'S run: LINES ARE NOT WRAPPED, the one exception to the rule at the
  # head of commands: the core reads a derived step's stdout as the paths the
  # release owns, and the wrapper prints its referent there. A stamp step seals
  # no verdict, so there is none for the referent to name.
  stamp:
    group: Release
    summary: The cut's derived steps; each prints the paths in its scope
    options:
      config:
        summary: intent_version in intent/.config/config.json
        run: bin/.devbin/cut/stamp config
      lock:
        summary: native/rust/Cargo.lock in step, with only workspace members moving
        run: bin/.devbin/cut/stamp lock
      schema:
        summary: the published schema faces, regenerated at the version
        run: bin/.devbin/cut/stamp schema
      cli:
        summary: the CLI built at the version, which the next three render with
        run: bin/.devbin/cut/stamp cli
      agents:
        summary: AGENTS.md, regenerated by the stamp CLI
        run: bin/.devbin/cut/stamp agents
      upgrade:
        summary: CLAUDE.md, refreshed by the stamp CLI's canon engine
        run: bin/.devbin/cut/stamp upgrade
      views:
        summary: the realised views re-rendered, folding in footer-only changes
        run: bin/.devbin/cut/stamp views

  # THE CUT'S GATES ON THE RELEASE COMMIT, run by the core as `gate all` in
  # release.gates. `all` runs every option active on this host, in this order:
  # the reads first, then the suites, then the pair and what reads it. The pair
  # and its two readers are held to macOS by `platforms:`, which the core's
  # pre-flight honours per leg, so a Linux leg runs the reads and the suites.
  gate:
    group: Release
    summary: The cut's gates on the release commit
    options:
      contract:
        summary: data-model.md and the published schema faces describe the same fields
        run: bin/.devbin/cmd/measured --exec bin/.devbin/cut/gate contract
      reference:
        summary: docs/reference describes the release commit
        run: bin/.devbin/cmd/measured --exec bin/.devbin/cut/gate reference
      rust:
        summary: every cargo step of rust.yml in a private worktree, with 0481's one re-run
        run: bin/.devbin/cmd/measured --exec bin/.devbin/cut/gate rust
      pair:
        summary: the pair built at the release commit (0518's currency verdict)
        platforms:
          - macos
        run: bin/.devbin/cmd/measured --exec bin/.devbin/cut/gate pair
      provenance:
        summary: each binary of the pair names the release commit from its own bytes
        platforms:
          - macos
        run: bin/.devbin/cmd/measured --exec bin/.devbin/cut/gate provenance
      doctor:
        summary: the pair's intent doctor is clean at the release commit
        platforms:
          - macos
        run: bin/.devbin/cmd/measured --exec bin/.devbin/cut/gate doctor

  # THE CUT'S PUBLICATION (ST0091 WP-03, vc decision 118): `cut publish` is the
  # first of the cut's two after: commands, bin/.devbin/cut/publish, which
  # builds the pair at the tag, ships the macOS assets, writes SHA256SUMS over
  # every asset and pushes the tap, stopping at the first failure.
  cut:
    group: Release
    summary: The cut's publication, after the release object exists
    options:
      publish:
        summary: the pair at the tag, the macOS assets, SHA256SUMS and the tap, stopping at the first failure
        run: bin/.devbin/cmd/measured --exec bin/.devbin/cut/publish

  # devbin's built-in formula (lib/cmd/formula), opted into here and configured
  # by the formula: block at the end of this file.
  formula:
    enabled: true

  # THE CUT'S macOS STAGE (ST0093 WP-06). Enabled, devbin's release core runs
  # `bin/devbin macos leg` as a leg of the cut at the release commit, beside the
  # gates and before the tag (lib/release.macos), so the app and the pair are
  # signed and notarised before anything is public. Intent's own handler,
  # cmd/macos, answers it; no macos: block is declared, so the core's own app
  # and binaries steps stay off and `cut publish` uploads what the leg staged.
  macos:
    enabled: true

  # devbin's release core cuts Intent (ST0091 WP-01): the release: block below
  # declares the cut, and `release.verbs` offers its verbs.
  release:
    enabled: true

# THE CUT (ST0091). devbin's release core runs it: resolve and pre-flight, one
# confirm, the stamp (devbin's `version set`, then `derived` below), the release
# commit, the legs (the gates, and the candidate's CI), the tag, the push, the
# object and its assets. Nothing another machine sees happens before the one
# confirm, and hv fires a cut in hv's own terminal (vc decision 3). The defaults
# stand where they fit: `tag: "v{version}"`, `branch: main`, `notes.kind:
# changelog` (CHANGELOG.md), `object: local`, `ci.workflow: tests.yml`, and the
# candidate at `candidate/{tag}`, whose push starts tests.yml and
# linux-release.yml (WP-04).
#
# `remotes` IS DECLARED, so a cut pushes to `local` and `upstream` and to no
# other remote this checkout lists; undeclared, it is every remote git lists.
# Built this way until hv rules (WP-01's body, C3).
#
# `repo` IS DECLARED BECAUSE NO REMOTE IS CALLED origin AND THE FIRST IS NOT
# GITHUB. Undeclared, it is read off the url of the first `remotes` entry, and
# `local` is a path on disk.
#
# `gates` ARE INTENT'S OWN CHECKS ON THE RELEASE COMMIT: `gate all` (the
# reads, the cargo steps, and on macOS the pair; bin/.devbin/cut/gate) and the
# shell suite. A red gate stops the cut before the tag. `build all` comes
# before `test shell` because the shell suite runs the pair at
# native/rust/target/release in the tree the gates stand in, and a leg's tree
# is a fresh worktree with none: `gate all` builds its pair in a private gate
# tree of its own, which the suite never sees (the 3.3.0 cut's kovacs leg, 158
# arms red on a missing binary). On this machine's leg it rebuilds the pair in
# place at the release commit.
#
# `legs` RUNS THOSE GATES ON kovacs TOO (ST0091 WP-02), the Ubuntu VM on this
# machine: the core pushes the release commit to a scratch repository there,
# runs `release.gates` in a worktree and copies the seal back. It is the Linux
# run the retired preflight-linux.sh ordered by hand before a push. On Linux the
# pair and its readers are inactive (`platforms:`), so the leg runs the reads,
# the cargo steps and the shell suite. A host the pre-flight cannot reach is
# named and recorded as not run.
#
# `preflight` IS INTENT'S OWN PRE-FLIGHT (ST0091 AC-01.3, devbin 0327): the
# four read-only checks of bin/.devbin/cut/preflight, which the core runs at its
# pre-flight, a dry run's included, after its own checks and before the
# confirm, each refusal named beside the core's. One line a check, so every
# refusal names its check. A live intentd refuses the cut here, before anything
# is stamped.
#
# `derived` IS THE STAMP, in the order its steps run: bin/.devbin/cut/stamp says
# what each writes, and why the lock comes before the schema.
#
# THE ASSETS ARE linux-release.yml's: its run on the release's candidate builds
# the two Linux packages, and `attach` uploads them and then writes SHA256SUMS
# over every asset on the object. The bound is read off the tag runs, measured
# with `gh run list` on 2026-10-27: v3.2.4's took 4m25s and v3.2.5's 4m26s,
# created to completed, so 15m leaves room for a runner queue.
release:
  repo: matthewsinclair/intent
  verbs:
    - cut
    - status
    - check
    - attach
    - gates
  remotes:
    - local
    - upstream
  title: "Intent {tag}"
  preflight:
    - preflight clean
    - preflight daemon
    - preflight faces
    - preflight spill
  gates:
    - gate all
    - build all
    - test shell
  legs:
    - kovacs
  after:
    - bin/devbin cut publish
    - bin/devbin brew smoke --at-tag
  derived:
    - bin/devbin stamp config
    - bin/devbin stamp lock
    - bin/devbin stamp schema
    - bin/devbin stamp cli
    - bin/devbin stamp agents
    - bin/devbin stamp upgrade
    - bin/devbin stamp views
  assets:
    workflow: linux-release.yml
    wait: 15m

# THE FORMULA AND THE CASK (ST0091 WP-03). devbin's built-in `formula` renders
# them in assets mode from the templates under packaging/homebrew/, every sha256
# read from the release's SHA256SUMS, and `bin/devbin cut publish` runs
# `formula publish --pull` under the cut's yes once the macOS assets and the
# sums are on the release. The tap is the default the built-in derives from
# release.repo, matthewsinclair/homebrew-intent. `release.formula` stays false
# (the default), because the core's formula step runs before Intent's macOS
# assets exist. Each platform's asset is one archive rooted at the install root
# (devbin 0329): on macOS, bin/intent, bin/intentd and the support tree, packed
# by `bin/devbin macos pack`, as the Linux packages already are. A 3.2.8 keg is
# untouched: `brew upgrade` reads the new formula, which names the new asset.
formula:
  mode: assets
  template: packaging/homebrew/intent.rb
  cask: packaging/homebrew/intent-app.rb
  sums: SHA256SUMS
  assets:
    - intent-aarch64-apple-darwin.tar.gz
    - intent-x86_64-unknown-linux-musl.tar.gz
    - intent-aarch64-unknown-linux-musl.tar.gz
    - Intent.app.zip

# THE TOOL'S LINK SET (devbin 0331, 0332): intent and intentd, moved as one,
# each built where the pair lands. The formula's generated install sets the
# executable bit on both and links both, and devbin's doctor reads each link's
# version line under its own name. Intent keeps its own switch and publish,
# `intent use` and `intent install`.
install:
  switch: intent use
  publish: intent install
  links:
    intent: native/rust/target/release/intent
    intentd: native/rust/target/release/intentd

# THE PAIR IN devbin's ARTEFACT CACHE (devbin issue 0338, ST0093 WP-06). The two
# binaries are declared at the STAGING paths where the guarded release build
# (cmd/shared/releasebuild.lib) builds and verifies them before it renames them
# into native/rust/target/release, so a pull lands there too. Only a build the
# release core runs pulls and puts, and a pull is taken only when the pair names
# HEAD; releasebuild.lib says why. The inputs are the build's, DIRT_SCOPE in
# native/rust/build-support/source_commit.rs, with native/rust named by its
# tracked entries, since no artefact's path may lie in an input path.
build:
  inputs:
    - native/rust/Cargo.toml
    - native/rust/Cargo.lock
    - native/rust/build-support
    - native/rust/crates
    - native/rust/rustfmt.toml
    - surface
    - docs/design
    - lib/templates/llm
    - lib/templates/prj
  artefacts:
    intent:
      tool: cargo
      path: native/rust/target/staging/release/intent
    intentd:
      tool: cargo
      path: native/rust/target/staging/release/intentd
