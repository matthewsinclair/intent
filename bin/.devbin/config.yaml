# intent -- devbin configuration.
#
# Written by: devbin install. Every key, annotated, is vendored beside this
# file at bin/.devbin/lib/config.reference.yaml.

project:
  name: intent

  # THERE IS NO `bin/intent` SYMLINK AND THERE MUST NEVER BE ONE.
  #
  # `intent` is the product's own binary name -- the native CLI this project
  # builds and ships. A devbin launcher of that name would shadow the product
  # binary, which is exactly the collision that retired the `bin/{project}`
  # convention estate-wide (Lamplight ships a `lamplight`; this project ships an
  # `intent`).
  # `name: intent` above is this project's identity, never an instruction to
  # create a symlink.
  #
  # hv RATIFIED THE CONVENTION 2026-08-27: the shim in a project is always
  # `bin/devbin`; a project MAY add a 2-3 character shortcut symlink to it by its
  # own choice; and tools and process always use `bin/devbin`, never the
  # shortcut. `int` below is that optional shortcut and it does NOT retire.
  #
  # THREE CLAIMS THAT STOOD HERE WERE FALSE BY 2026-08-27 AND ARE RECORDED SO
  # NOBODY RESTORES THEM FROM MEMORY:
  #
  #   1. "devbin doctor reports its absence as a note" -- it does not. doctor
  #      only comments on a symlink that EXISTS and pointedly says a real file of
  #      that name is the project's own binary and none of devbin's business.
  #      Driven: `bin/devbin doctor` says nothing about `bin/intent` at all.
  #   2. "`link_alias` refuses to replace a real file" -- `link_alias` is GONE,
  #      deleted outright rather than guarded, so the protection is now
  #      structural rather than conditional. See lib/cmd/install.
  #   3. "when the v2 CLI is retired, `bin/intent` frees up and `link_alias`
  #      will create it on the next install" -- THIS WAS THE DANGEROUS ONE. It
  #      told a future maintainer to EXPECT the collision above, in the one
  #      estate whose product binary is called `intent`. The v2 CLI has since
  #      been removed from this tree, and nothing creates `bin/intent`.
  #
  # `int` rather than the estate's usual 2-letter alias: `in` is a bash reserved
  # word. Driven 2026-08-27, and the claim is narrower than it was written: bare
  # `in test all` is rc=2 in bash and rc=0 in zsh, so it fails only when invoked
  # BARE. Path-qualified `bin/in test all` is rc=0 in BOTH shells, which is how
  # shortcuts are always invoked -- so `in` was in fact available. `int` works,
  # is what everything already types, and there is no reason to move.
  alias: int

  # WHICH TREE DID THIS VERDICT DESCRIBE. devbin runs this once at process
  # start and prints its stdout beside every `verdict:` and beside the `all`
  # summary. It never parses the string -- it cannot tell a sha from a
  # hostname, and that ignorance is the layer boundary, not an oversight.
  #
  # The whole reason this is a config key rather than a variable exported from
  # `bin/devbin` is that `bin/devbin` is DEVBIN'S file (it is listed in
  # bin/.devbin/manifest.sha256). It was
  # wired there first, and `int vendor` reported it DIVERGED on the very next
  # run -- the vendoring check catching a fork of the dispatcher by the person
  # who had just quoted the ownership rule at himself. `config.yaml` and `cmd/`
  # are ours; this uses both and leaves the vendored tree stock.
  #
  # Several nodes commit into one clone here, so the interval between a compiler
  # reading a file and a human reading the verdict routinely contains someone
  # else's edits. A verdict that has outlived its tree is indistinguishable, by
  # inspection, from a verdict about landed code.
  referent: bin/.devbin/cmd/measured --value

  # The files that MIRROR the version. `version set|bump|sync` writes each of
  # them; `version check` reports any that have drifted.
  #
  # `version_from` IS DELIBERATELY NOT DECLARED. It defaults to `VERSION`, which
  # is what this project uses, and the header rule holds: config carries the
  # DIFFERENCES from the catalogue, never a second copy of it. But the fact
  # still has to be STATED somewhere, because here it is counter-intuitive --
  # `VERSION` is the source and `native/rust/Cargo.toml` is the mirror, even
  # though the Cargo.toml is the one the shipped binaries actually read.
  #
  # THAT INVERSION IS WHY THIS BLOCK EXISTS AT ALL. Every crate takes
  # `version.workspace = true`, and both binaries compile their version string
  # from `env!("CARGO_PKG_VERSION")` -- so the number on `intent --version`, and
  # on the page intentd serves, comes from the Cargo.toml and not from VERSION.
  # Nothing held the two equal outside a release cut. Until this landed,
  # `version check` answered `version: 3.0.0, every sidecar agrees` at rc=0 over
  # an EMPTY list: green because it examined nothing, which is worse than
  # absent -- it actively answers the question it is not asking.
  #
  # OTHER FILES HOLD THE VERSION AND ARE DELIBERATELY OUT. Each is out for its
  # own reason, and none of them is an oversight:
  #
  #   native/rust/Cargo.lock -- devbin refuses a lockfile BY NAME, because no
  #     generic recipe can know which `[[package]]` entries are this project's
  #     own (lib/cmd/version). Ours is synced by cmd/build.d/release, which asks
  #     cargo to do it and then refuses any diff beyond the workspace member
  #     version lines.
  #
  #   native/macos/Intent/Intent/Info.plist -- it holds `$(INTENT_VERSION)`, an
  #     Xcode build-setting reference, NOT a literal. devbin's PlistBuddy recipe
  #     would replace that reference with a number and silently un-wire the app
  #     from its build settings. Conflab DOES declare its plist and this is not
  #     a divergence from Conflab: the difference is the FILE, not the
  #     convention -- Conflab's holds a literal. Do not add ours by symmetry.
  #
  #   intent/.config/config.json -- `intent_version` is Intent's self-hosting
  #     stamp. devbin has no recipe for it (`config.json` is not
  #     `package.json`), so it falls to the bare-version default, which
  #     `assert_bare_version_sidecar` refuses rather than overwriting the whole
  #     file. Driven, not assumed: declaring it makes `version sync` die with
  #     "cannot write the version into intent/.config/config.json", and the
  #     preflight pass means nothing else is written either. The release cut
  #     stamps it with `stamp_project_version` in cmd/build.d/release, and
  #     `intent upgrade` stamps it on an upgrade.
  #
  # AGENTS.md and CLAUDE.md carry a `Generated by Intent vX.Y.Z` banner and are
  # not homes either: they are DERIVED, regenerated from the config stamp above
  # by `intent agents sync` and `intent claude upgrade --apply`. The release
  # handler runs both and refuses to tag if either fails.
  version_sidecars:
    - native/rust/Cargo.toml

  # shell: the bats suite and the shell critic are both real gates here.
  # rust: the ST0056 native binary -- the reason devbin is in this project.
  languages:
    - shell
    - rust

# The devbin this project expects. Enforced by: devbin doctor
devbin_version: "^0.1.0"

# EVERY `run:` LINE BELOW IS WRAPPED IN `bin/.devbin/cmd/measured --exec`, WHICH
# PRINTS ONE LINE AND THEN BECOMES THE COMMAND. That line records the commit and
# the clean/dirty state AT RUN START, so the run log names the tree its verdict
# describes. Without it a run over a dirty worktree and a run over a clean
# checkout produce artefacts identical in form and incomparable in meaning --
# measured here on 2026-08-17, when several sessions went into establishing that
# the red legs were not regressions, and GREEN legs from the same run certified a
# tree nobody had.
#
# A WRAPPER, AND NOT SOMETHING PRETTIER, BECAUSE `run:` IS WORD-SPLIT AND
# DELIBERATELY NOT `eval` (lib/resolve). `;` and `&&` arrive as literal argv, so
# a two-command line is not expressible here; devbin's own comment states the
# rule -- a command line that needs real quoting needs a handler. `--exec` is
# that handler, kept to one job.
#
# IT LIVES IN THE PROJECT, NOT IN DEVBIN. Intent knows it is a git checkout;
# devbin does not, and must not have to -- devbin echoes the referent string and
# never composes or parses one. (devbin's lib/ does call git for other jobs, so
# the boundary is the layer, not an absence of git from the vendored tree.)
#
# ADDING A GATE? Wrap it too. The stamp reaches only `run:` lines, so the
# catalogue builtins (`check critic`, `check toolchain`, `check autotests`,
# `check targetdir`, the docs gates, `fmt md`) record nothing. `int measured`
# prints NONE RECORDED for those rather than omitting them, because an unstamped
# run must never read like a run that started clean.
commands:
  test:
    options:
      shell:
        # NOT the catalogue's `bats tests`. That is non-recursive and this
        # project's suites live under tests/unit/, so it found nothing and
        # `test all` went red on an empty suite. The project runner
        # (tests/run_tests.sh) also exports BATS_LIB_PATH, which every suite
        # needs to load its helpers, and INTENT_HOME -- raw bats would find
        # the files and then fail them.
        summary: the BATS suite via the project runner (exports INTENT_HOME + BATS_LIB_PATH)
        run: bin/.devbin/cmd/measured --exec tests/run_tests.sh

      # THE CARGO WORKSPACE IS NOT AT THE PROJECT ROOT, AND THE CATALOGUE
      # ASSUMES IT IS. Every catalogue-derived cargo line -- `test rust`,
      # `check clippy`, `fmt rust`, and the `check format` builtin's rust arm --
      # runs in a subshell at PROJECT_ROOT (lib/resolve, and that is the right
      # default: a declared `run:` is a project command and belongs at the root).
      # Since a1a949c moved all native code to native/rust/ there is no
      # Cargo.toml there, so each died with `could not find Cargo.toml`.
      #
      # THE ROOT MANIFEST IS NOT COMING BACK. It is what the move deleted, and
      # cmd/prepush now REFUSES a push that reintroduces a second workspace
      # manifest outside crates/. `--manifest-path` is cargo's own answer to
      # "the workspace is not where you are standing" and needs no cd.
      #
      # These read verbatim like .github/workflows/rust.yml, which sets
      # `working-directory: native/rust` and was updated by the move while these
      # were not. Same checks, two homes, one of them followed the move --
      # so keep the flags identical and the drift stays visible.
      rust:
        summary: the workspace suite (native/rust -- the catalogue assumes a root manifest)
        # `--no-fail-fast` because WITHOUT IT ONE EARLY FAILURE ABORTS EVERY
        # REMAINING TARGET while the run still prints a total that reads like a
        # whole-workspace number. conflab-vc measured it on their own tree
        # (2026-08-10): a lib-target failure left most targets unrun and the
        # suite reported a total short of what the crate holds. This workspace
        # was exposed further and nobody here had checked. Kept identical to
        # .github/workflows/rust.yml per the note above, so the drift stays
        # visible.
        run: bin/.devbin/cmd/measured --exec cargo test --workspace --no-fail-fast --manifest-path native/rust/Cargo.toml

  check:
    options:
      clippy:
        # `--manifest-path` before the `--`; everything after it is rustc's.
        summary: clippy over the whole workspace, warnings as errors
        run: bin/.devbin/cmd/measured --exec cargo clippy --workspace --all-targets --manifest-path native/rust/Cargo.toml -- -D warnings

      # DECLARED BECAUSE `fmt rust` IS DECLARED, and devbin will not let it be
      # otherwise: builtin_check_format REFUSES a language whose `fmt` arm the
      # config has overridden, rather than verifying a command line the
      # formatter no longer runs. Loud by design -- follow its instruction.
      #
      # THE COST, WHICH IS REAL: this replaces the whole multi-language builtin
      # with one command line. Today `languages: [shell, rust]` and shell has no
      # formatter arm, so rust IS the entire check and this is equivalent. ADD A
      # THIRD LANGUAGE AND ITS FORMAT CHECK SILENTLY DOES NOT HAPPEN. The
      # tripwire is in tests/unit/devbin_rust_gates.bats, which pins the
      # declared language set for exactly this reason.
      format:
        summary: rustfmt over the workspace, non-mutating
        run: bin/.devbin/cmd/measured --exec cargo fmt --all --manifest-path native/rust/Cargo.toml --check

      # REPORT-ONLY BY MEASUREMENT, NOT BY CHOICE OF FLAG: `cargo doc` warns on a
      # broken intra-doc link and STILL EXITS 0. Driven both ways on a throwaway
      # crate rather than assumed -- no broken link: 0 warnings, rc 0; one broken
      # link planted: 1 warning naming it, rc 0. So this option reports, and it
      # can never be the thing that turns `check all` red.
      #
      # SO IT DEVIATES FROM THIS GROUP'S OWN CONTRACT, AND THAT IS WORTH SAYING
      # OUT LOUD RATHER THAN LEAVING FOR SOMEONE TO FIND. `check` declares itself
      # as "read-only gates; each exits non-zero on a breach", and this one does
      # not: it exits 0 over every broken intra-doc link it reports. `toolchain`
      # does NOT bend the same rule -- it reports that no pin is declared, which
      # is an absence of breach rather than a breach it forgives.
      # The deviation ends when the -D flip below lands. Until then the option's
      # own summary line says report-only, so nobody has to read this far.
      #
      # WHY IT DOES NOT GATE, WHICH IS A FACT ABOUT WHOSE FILES THESE ARE. The
      # census on 2026-08-27 found warnings of the kinds below, and only the first
      # is what this option is for:
      #     unresolved intra-doc link
      #     public documentation links to a private item
      #     unclosed HTML tag
      #     `todo` is both a function and a macro
      # The unresolved links lived in crates/intentsvcs and crates/intent-cli --
      # other lanes' files. Turning this red would fail their commits on a gate
      # declared here, so it reports until they are cleared. `int check doc`
      # prints the current warnings; nothing here records how many there are.
      #
      # THE GATEABLE FORM IS ONE ENV VAR, AND IT IS MEASURED RATHER THAN ASSERTED:
      # RUSTDOCFLAGS="-D rustdoc::broken_intra_doc_links" returns rc 101 on the
      # planted link and rc 0 once that same link is repaired. Flip to it when
      # `int check doc` reports no unresolved intra-doc link. THE OTHER CLASSES
      # MUST NOT BE SWEPT IN WITH THEM -- a blanket -D over rustdoc's lints would
      # gate on findings this option was never about, and it would arrive
      # looking like the same decision.
      #
      # THE COST, STATED BECAUSE THE toolchain COMMENT BELOW IS RIGHT ABOUT NOISE:
      # this adds every rustdoc warning to every `check all`. That is the
      # harmless kind of noise -- it cannot hide a red, because it cannot
      # produce one.
      doc:
        summary: rustdoc over the workspace, report-only (intra-doc links)
        run: bin/.devbin/cmd/measured --exec cargo doc --no-deps --document-private-items --manifest-path native/rust/Cargo.toml

      # ON, AND GREEN FOR A STATED REASON RATHER THAN OFF. hv ruled 2026-08-19:
      # Intent does NOT pin its toolchain -- "we're not using asdf, mise, or
      # anything like that here, and I don't want to impose anything like that on
      # a user". So the answer was never to add a `.tool-versions`; it was that a
      # project legitimately declaring no pin must not read as a violation.
      #
      # This was `enabled: false` from 2026-08-16, because `int check all` was
      # permanently red on a missing `.tool-versions` -- and a permanently-red
      # aggregate is worse than a slow one: a slow gate gets bypassed, an
      # always-red gate gets ignored, and the real failure hides in the noise.
      # Disabling it stopped the noise and left a gate switched off, which is a
      # state nobody reviews. Now the gate RUNS and reports "no .tool-versions --
      # this project declares no toolchain pin".
      #
      # THE FIX LANDED UPSTREAM. The defect was devbin's rather than Intent's --
      # the function already report-and-passed on a `.tool-versions` that pins
      # NOTHING while it `die`-d on the file being absent, so one gate answered
      # "this project declares no pin" two opposite ways depending on how the
      # project expressed it. The vendored `lib/cmd/check` now reports the
      # absent file the same way, and `int vendor` reports no local patch.
      #
      # The neighbouring decision is unchanged and still recorded in
      # .github/workflows/rust.yml: NO rust-toolchain.toml, because rustup is not
      # installed here and rustc is Homebrew's, so such a file is ignored in
      # silence -- a pin that does not bind is worse than no pin, because it does
      # not refuse and it misleads. The standing cost is also unchanged: `fmt
      # --check` and `clippy -D warnings` float on @stable, so CI can go red with
      # zero code change when a new stable lands.
      toolchain:
        enabled: true

  fmt:
    options:
      # `--all` IS LOAD-BEARING AND ITS ABSENCE FAILS IN THE DIRECTION THAT
      # LOOKS LIKE A FINDING. native/rust/Cargo.toml is a VIRTUAL manifest (no
      # root package), so `cargo fmt --manifest-path <it>` reports
      # `Failed to find targets` and exits 1 -- indistinguishable at the exit
      # code from "found unformatted files". Measured, not assumed: with --all
      # this covers the same files as CI's invocation, set-for-set.
      rust:
        summary: rustfmt over the workspace, in place
        run: bin/.devbin/cmd/measured --exec cargo fmt --all --manifest-path native/rust/Cargo.toml

  build:
    group: Build
    # Every arm (all, cli, daemon, release) is a handler under cmd/build.d/, not
    # a `run:` line: `release` is interactive (it confirms before pushing) and
    # must EXEC so Ctrl-C and the prompt reach the terminal, and the build arms
    # sit beside it rather than being declared in a second style. `bin/devbin
    # build --help` lists them; `bin/devbin help build` does not, because help
    # enumerates only declared options.
