name: rust

# AN ALLOW-LIST, DELIBERATELY, AND THE FILE NEXT DOOR ARGUES AGAINST ONE (issue
# 0508, ruled by hv 2026-09-22). `tests.yml:6-10` makes the case for
# `paths-ignore` over `paths:` at length, and names `paths:` as "the false-green
# class this project keeps closing": forget an entry and the workflow stops
# running while reporting nothing, which is indistinguishable from a workflow
# that ran and passed. That argument is sound and this file uses the form it
# argues against, so the two workflows hold opposite positions on one question.
#
# IT STAYS, FOR A COST REASON AND A COVERAGE ONE, AND THE COVERAGE ONE IS WHY
# THE COST REASON IS ALLOWED TO WIN. This is the expensive workflow -- a full
# Rust build on two platforms -- and converting it to `paths-ignore` would run
# it on every push including documentation-only ones. That alone would not
# settle it, because a cost argument never outranks a silent gap. What settles
# it is that the gap is covered elsewhere: `tests.yml` uses `paths-ignore`, so
# it runs on everything except `intent/whiteboard/**` and `intent/.canon/**`,
# and it BUILDS THE PAIR. The one class this allow-list plausibly omits is
# build tooling outside `native/rust/` -- a change under `bin/.devbin/` that
# breaks the Rust build -- and such a change reaches `tests.yml`, which builds.
#
# SO THE EXPOSURE IS SHAPE RATHER THAN SUBSTANCE, and it is recorded here
# rather than fixed because the next person to notice the contradiction should
# find the reasoning instead of re-deriving it. If `tests.yml` ever narrows its
# own triggers, this reasoning expires with it and the conversion is owed.
on:
  push:
    branches: [main]
    paths:
      - "native/rust/**"
      - "schema/**"
      - "surface/**"
      - ".github/workflows/rust.yml"
      # A move of the fleet's Rust moves fmt and clippy, so it runs this.
      - ".github/actions/fleet-rust/**"
  pull_request:
    paths:
      - "native/rust/**"
      - "schema/**"
      - "surface/**"
      - ".github/workflows/rust.yml"
      # A move of the fleet's Rust moves fmt and clippy, so it runs this.
      - ".github/actions/fleet-rust/**"
  # A RELEASE RUNS THIS FROM tests.yml (ST0091 WP-04), whose run on the cut's
  # candidate is the one verdict the cut reads, so this job's verdict is part of
  # it. Called, it runs whatever the push touched: the caller's trigger decides,
  # and the path filters above are not read. No tag starts it, since the
  # candidate carries the release commit before any tag exists.
  workflow_call:
  workflow_dispatch:

# SUPERSEDED RUNS ARE CANCELLED (hv's ruling of 2026-09-21, devbin#0108: every
# repository cancels superseded runs on push). This file carried no concurrency
# block until 2026-09-22; the ruling went out across the fleet and did not land
# in either of this repository's push-triggered workflows, and an absent block
# is indistinguishable from a repository nobody reached.
#
# Keyed on the event as well as the ref, so this group matches the one in
# tests.yml and in every other estate rather than being a second shape. This
# workflow's own name is written where the others read `github.workflow`, which
# names the same group when it runs on its own triggers. Called from tests.yml,
# `github.workflow` is the caller's name, so the group would be the caller's
# own, and GitHub cancels a called workflow that shares its caller's group as
# a deadlock.
concurrency:
  group: rust-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        # macOS RUNS ONLY FOR A RELEASE OR BY HAND (hv, fleet decision 30,
        # restated 2026-09-25): a push to main or a pull request runs Linux alone.
        # A release is its candidate, which tests.yml calls this for (ST0091
        # WP-04). Called, the `github` context is the caller's, so a candidate's
        # ref and a dispatch of tests.yml both reach this as they are.
        os: ${{ fromJSON((startsWith(github.ref, 'refs/heads/candidate/') || github.event_name == 'workflow_dispatch') && '["macos-latest", "ubuntu-latest"]' || '["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    # The suite points HOME at fixture directories, and Intent resolves its
    # per-user paths from the XDG_* variables before HOME. GitHub's Linux
    # runners set some of them, which would send a fixture's config and daemon
    # socket to the runner's own directories. Intent reads an empty value as
    # unset.
    env:
      XDG_CONFIG_HOME: ""
      XDG_DATA_HOME: ""
      XDG_STATE_HOME: ""
      XDG_RUNTIME_DIR: ""
    defaults:
      run:
        working-directory: native/rust
    steps:
      - uses: actions/checkout@v4
      # The fleet's Rust, its version written once in the action
      # (.github/actions/fleet-rust/action.yml).
      - uses: ./.github/actions/fleet-rust
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          # `defaults.run.working-directory` does not apply to `uses:` steps,
          # so the cache action needs telling where the workspace is or it
          # looks for Cargo.toml at the repository root and finds none.
          workspaces: native/rust
      - name: record the toolchain this run actually used
        # `fmt --check` and `clippy -D warnings` are both gates and both move
        # with the compiler. CI USED TO FLOAT ON @stable, and so went red with
        # zero code change whenever a new stable landed before the fleet had
        # it: the fleet's local gates and CI then judged one commit by two
        # compilers. CI NOW FOLLOWS THE FLEET (hv, 2026-11-13: "We should be on
        # the same everywhere"): the fleet runs Homebrew's stable, and the
        # fleet-rust action pins CI to that version in its one line. Moving brew
        # means moving that line. This step records what the run actually used,
        # so a pin that did not take is visible here rather than dug out of a
        # `uses:` step's log.
        #
        # DELIBERATELY NOT a rust-toolchain.toml. Measured on the primary dev
        # machine 2026-08-15: cargo/rustc are Homebrew's real binaries, rustup
        # is NOT INSTALLED, and a rust-toolchain.toml pinning 1.70.0 is ignored
        # in silence -- rustc still reported 1.97.1. Such a file would bind CI
        # only, while reading as a project-wide guarantee. A pin that does not
        # bind is worse than no pin: it does not refuse, and it misleads. The
        # fleet-rust pin binds CI alone too, but says so where it is written,
        # and the fleet is bound by brew to the same version.
        run: |
          rustc --version | tee -a "$GITHUB_STEP_SUMMARY"
          cargo --version | tee -a "$GITHUB_STEP_SUMMARY"
      - name: shellcheck (an armed tool, not an optional extra)
        # `exit_codes.rs` drives the SHIPPED pre-commit gate in a fixture that
        # declares `shell`, so the gate invokes `intent critic shell`. The shell
        # rule pack arms IN-SH-CODE-001 and IN-SH-CODE-002 on shellcheck, and
        # the critic refuses -- fails CLOSED, by design -- when an armed rule
        # cannot be enforced. `ubuntu-latest` ships shellcheck; `macos-latest`
        # does not, so without this step identical code passes on Linux and
        # fails on macOS.
        if: runner.os == 'macOS'
        run: brew install shellcheck
      - name: prettier (an armed tool, not an optional extra -- same class as shellcheck)
        # `view_single_writer.rs` asserts AC-07.6 by RUNNING prettier over a
        # rendered view, and `require_prettier()` PANICS when it is absent
        # rather than skipping -- deliberately, because "a skip here is a green
        # that means nothing, on a criterion about instruments that pass
        # without measuring". It was right and nobody was reading it.
        #
        # NEITHER RUNNER SHIPS PRETTIER, so unlike the shellcheck step above
        # this needs no `if:` -- that one is macOS-only because ubuntu-latest
        # ships shellcheck. Without this step the prettier arms fail on BOTH
        # legs while passing locally: the primary dev machine has prettier from
        # Homebrew, so a local green does not show the runners lack it.
        #
        # PINNED TO THE MAJOR, NOT THE PATCH, AND THE REASON IS THIS FILE'S OWN.
        # A pin that binds CI while the dev machine floats "does not refuse,
        # and it misleads" -- the rust-toolchain.toml argument. Rust is pinned
        # exactly because hv's ruling holds CI to the fleet's one rustc, which
        # the fleet-rust action names. Prettier locally is Homebrew's and no
        # ruling holds it to one version, so an exact CI pin would bind one
        # side of a two-sided gate. `@3` binds the CONTRACT the tests rely on
        # (3.x emphasis normalisation) and leaves both sides in the same
        # regime; this step's own second line records the version to the job
        # summary so drift is diagnosable rather than mysterious.
        #
        # THAT SECOND LINE IS ALSO THE INSTALL'S OWN CHECK, WHICH IS WHY IT IS
        # `prettier --version` AND NOT `npm ls`. If the global install does not
        # put the binary on PATH -- a real risk, since the two runners lay out
        # their npm prefix differently -- this STEP fails, loudly, naming the
        # tool. Without it the install would appear to succeed and the prettier
        # arms would fail later in the job with `prettier is not on PATH`, which
        # reads as the defect being fixed here rather than as a broken fix.
        # pipefail, because the step shell is bash -e without it: the pipeline's
        # status would be tee's, and a missing prettier would pass.
        run: |
          set -o pipefail
          npm install -g prettier@3
          prettier --version | tee -a "$GITHUB_STEP_SUMMARY"

      - name: fmt
        run: cargo fmt --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: clippy, IN-RS-CODE-001 (no unwrap, expect or panic in library code)
        # The library targets of intentsvcs and intent-cli, and NEVER --all-targets:
        # the rule governs src/lib.rs and its descendants, so colocated #[cfg(test)]
        # code stays out, and the build scripts stay out behind a crate-level allow
        # because a build-script panic fails the build the way main.rs exits (vc,
        # 2026-09-15). The three lints are in clippy's restriction group, so this
        # step is the only thing that turns them on.
        run: cargo clippy -p intentsvcs -p intent-cli --lib -- -D clippy::unwrap_used -D clippy::expect_used -D clippy::panic
      - name: clippy, IN-RS-CODE-001 over intentd's binary
        # intentd has no library target, so the step above cannot reach it, and
        # until issue 0649 nothing did. Its build script stays out behind the same
        # crate-level allow as intent-cli's. testkit is left out on purpose: it
        # is test support, and its panic is how the calling test fails (the
        # rule's When This Does Not Apply says so).
        run: cargo clippy -p intentd --bins -- -D clippy::unwrap_used -D clippy::expect_used -D clippy::panic
      - name: clippy, IN-RS-CODE-002 (no argument taken by value only to be borrowed)
        # needless_pass_by_value is pedantic, so default clippy never runs it, and
        # the critic deferred the rule to a clippy that never asked (issue 0649).
        # Library and binary code only, as the step above: tests stay out. The
        # rule's third lint, redundant_clone, is nursery and is deliberately not
        # gated.
        run: cargo clippy --workspace --lib --bins -- -D clippy::needless_pass_by_value
      - name: doc (every intra-doc link resolves, issue 0451)
        # Broken links accumulated with nothing reporting them -- links to items
        # that were renamed, to test functions, to private items from public docs
        # -- because `cargo doc` ran nowhere. Under `-D warnings` a new one fails
        # here instead of adding to a count nobody reads.
        #
        # THE SAME COMMAND AS devbin's `doc` gate, flag for flag
        # (devbin_rust_gates.bats pins every CI cargo line to a devbin twin), so
        # `--document-private-items`: the maintainers' docs, private items
        # included, which is also the stricter of the two renderings.
        #
        # `-Dwarnings`, NOT `-D warnings`, AND THE SPACE IS THE REASON (issue
        # 0501). The twin test compares this env with the devbin line's own, and
        # a devbin `run:` line is word-split and never eval'd, so it cannot carry
        # a value with a space. rustdoc reads both spellings as one flag.
        env:
          RUSTDOCFLAGS: -Dwarnings
        run: cargo doc --no-deps --document-private-items
      - name: test (includes the schema-face drift check and the dep-graph guard)
        run: cargo test --workspace --no-fail-fast
