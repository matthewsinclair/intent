name: rust

on:
  push:
    branches: [main]
    paths:
      - "native/rust/**"
      - "schema/**"
      - "surface/**"
      - ".github/workflows/rust.yml"
  pull_request:
    paths:
      - "native/rust/**"
      - "schema/**"
      - "surface/**"
      - ".github/workflows/rust.yml"

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: native/rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          # `defaults.run.working-directory` does not apply to `uses:` steps,
          # so the cache action needs telling where the workspace is or it
          # looks for Cargo.toml at the repository root and finds none.
          workspaces: native/rust
      - name: record the toolchain this run actually used
        # `fmt --check` and `clippy -D warnings` are both gates and both move
        # with the compiler, so this job can go red with zero code change when
        # a new stable lands. That is legitimate -- catching new lints early is
        # part of why the gate floats on @stable -- but it is only diagnosable
        # if the version is visible, so it is recorded here rather than left to
        # be dug out of a `uses:` step's log.
        #
        # DELIBERATELY NOT a rust-toolchain.toml. Measured on the primary dev
        # machine 2026-08-15: cargo/rustc are Homebrew's real binaries, rustup
        # is NOT INSTALLED, and a rust-toolchain.toml pinning 1.70.0 is ignored
        # in silence -- rustc still reported 1.97.1. Such a file would bind CI
        # only, while reading as a project-wide guarantee. A pin that does not
        # bind is worse than no pin: it does not refuse, and it misleads.
        run: |
          rustc --version | tee -a "$GITHUB_STEP_SUMMARY"
          cargo --version | tee -a "$GITHUB_STEP_SUMMARY"
      - name: shellcheck (an armed tool, not an optional extra)
        # `exit_codes.rs` drives the SHIPPED pre-commit gate, which invokes
        # `intent critic shell`. This project arms IN-SH-CODE-001 and
        # IN-SH-CODE-002 on shellcheck, and the critic refuses -- fails CLOSED,
        # by design -- when an armed rule cannot be enforced. `ubuntu-latest`
        # ships shellcheck; `macos-latest` does not, which is why this job has
        # been green on Linux and red on macOS with identical code.
        if: runner.os == 'macOS'
        run: brew install shellcheck
      - name: prettier (an armed tool, not an optional extra -- same class as shellcheck)
        # `view_single_writer.rs` asserts AC-07.6 by RUNNING prettier over a
        # rendered view, and `require_prettier()` PANICS when it is absent
        # rather than skipping -- deliberately, because "a skip here is a green
        # that means nothing, on a criterion about instruments that pass
        # without measuring". It was right and nobody was reading it.
        #
        # NEITHER RUNNER SHIPS PRETTIER, so unlike the shellcheck step above
        # this needs no `if:` -- that one is macOS-only because ubuntu-latest
        # ships shellcheck. Five arms have failed on BOTH legs since
        # 2026-08-29, which is every run since, and the local greens were real:
        # the primary dev machine has prettier from Homebrew, so the arms
        # measured there and only there.
        #
        # PINNED TO THE MAJOR, NOT THE PATCH, AND THE REASON IS THIS FILE'S OWN.
        # The rustc step ABOVE records rather than pins, because a pin that
        # binds CI while the dev machine floats "does not refuse, and it
        # misleads" -- the rust-toolchain.toml argument. Prettier locally is
        # Homebrew's and floats the same way, so an exact CI pin would bind one
        # side of a two-sided gate. `@3` binds the CONTRACT the tests rely on
        # (3.x emphasis normalisation) and leaves both sides in the same
        # regime; this step's own second line records the version to the job
        # summary so drift is diagnosable rather than mysterious.
        #
        # THAT SECOND LINE IS ALSO THE INSTALL'S OWN CHECK, WHICH IS WHY IT IS
        # `prettier --version` AND NOT `npm ls`. If the global install does not
        # put the binary on PATH -- a real risk, since the two runners lay out
        # their npm prefix differently -- this STEP fails, loudly, naming the
        # tool. Without it the install would appear to succeed and five arms
        # would fail forty lines later with `prettier is not on PATH`, which
        # reads as the defect being fixed here rather than as a broken fix.
        run: |
          npm install -g prettier@3
          prettier --version | tee -a "$GITHUB_STEP_SUMMARY"

      - name: fmt
        run: cargo fmt --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test (includes the schema-face drift check and the dep-graph guard)
        run: cargo test --workspace --no-fail-fast
