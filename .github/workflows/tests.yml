name: Intent Tests

on:
  push:
    branches: [main]
    # IGNORE-LIST, DELIBERATELY, NOT AN ALLOW-LIST. `paths-ignore` fails safe:
    # forget an entry and the suite still runs. `paths:` fails SILENT -- forget
    # an entry and the suite stops running while reporting nothing, which is the
    # false-green class this project keeps closing. Only ever add here what has
    # been measured to be inert.
    #
    # Why this one is inert, measured 2026-08-15 rather than assumed: no test in
    # the estate reads the real `intent/whiteboard/**`. The two suites that name
    # those paths build their own fixture first (`whiteboard_protocol_3_guard`
    # and `whiteboard_clock_guard` both `create_test_project` and cd into it),
    # and `docs_completeness` reads `usage-rules.md`, not a board. A board edit
    # therefore cannot change a test outcome.
    #
    # Why it is worth having: Intent dogfoods a five-node whiteboard, so four
    # concurrent sessions commit coordination markdown continuously. Every one
    # of those was starting the full matrix -- Ubuntu plus macOS, whole BATS
    # suite -- and the queue reached eleven minutes on 2026-08-15, which is the
    # feedback loop for every node including the ones whose code changes matter.
    #
    # A commit touching a board AND anything else still runs: GitHub runs the
    # workflow when any changed path is outside the ignore list.
    paths-ignore:
      - "intent/whiteboard/**"
  pull_request:
    branches: [main]
    paths-ignore:
      - "intent/whiteboard/**"

jobs:
  test-linux:
    name: Test on Ubuntu
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Fetch all history for proper testing

    # tests/unit/shipped_surface_drift.bats compares the v3 shipped surface
    # against v2-maintenance -- the frozen tree every project on the dev
    # machine actually executes via $INTENT_HOME. A runner has no v2 CHECKOUT,
    # so the guard resolves that surface from this REF instead, and when
    # neither is available it now FAILS rather than skipping.
    #
    # THAT ASYMMETRY IS WHY THIS STEP IS EXPLICIT RATHER THAN IMPLIED. The
    # `fetch-depth: 0` above already brings every branch today, so this looks
    # redundant and is not: dropping it to `1` for speed is an ordinary,
    # plausible edit that would silently return the guard to reporting green
    # over nothing. That was its state for its first day -- all three of its
    # tests skipped in CI, INCLUDING THE POSITIVE CONTROL whose whole job is to
    # prove the comparison looked at something, and the suite printed "All
    # tests passed!". A dependency you can read is one you can keep.
    - name: Fetch v2-maintenance for the shipped-surface drift guard
      run: |
        git fetch --no-tags origin +refs/heads/v2-maintenance:refs/remotes/origin/v2-maintenance
        # Self-checking: if the fetch above silently brought nothing, say so
        # here rather than letting the guard report the whole surface missing.
        git rev-parse --verify origin/v2-maintenance

    - name: Install bats-core
      run: |
        # Install bats-core v1.12.0 from GitHub
        wget https://github.com/bats-core/bats-core/archive/v1.12.0.tar.gz
        tar -xzf v1.12.0.tar.gz
        cd bats-core-1.12.0
        sudo ./install.sh /usr/local
        # Make sure bats is in PATH
        echo "PATH=/usr/local/bin:$PATH" >> $GITHUB_ENV
        which bats
        bats --version

    - name: Install dependencies
      run: |
        # Install jq. `apt-get update` can exit non-zero when an unrelated
        # third-party repo on the GH runner image serves a bad signature (eg the
        # Azure/MS apt repos periodically return "Clearsigned file isn't valid,
        # got 'NOSPLIT'"); under `bash -e` that aborts the job before jq is ever
        # installed. Tolerate it -- the Ubuntu main/universe repos, where jq
        # lives, still refresh -- then verify jq is actually present (fail loud
        # if not, rather than trusting the exit code).
        sudo apt-get update || true
        sudo apt-get install -y jq || true
        jq --version
    
    - name: Make scripts executable
      run: |
        chmod +x bin/*
        chmod +x tests/*.sh 2>/dev/null || true

    - name: Add Intent bin to PATH
      run: |
        # ST0035/WP-06's pre_commit_hook.bats invokes `intent critic` via
        # the project's pre-commit hook. The hook fail-opens when `intent`
        # is not on PATH, which makes the bad-fixture test pass-through
        # instead of blocking. Put the project's bin/ on PATH so the
        # critic gate is exercisable in CI.
        echo "${{ github.workspace }}/bin" >> $GITHUB_PATH

    - name: Configure git identity
      run: |
        # WP-15's intent_claude_upgrade.bats NORMALIZE_GITIGNORE scenarios
        # call `git commit` in scratch repos to establish a baseline. Stock
        # CI runners have no global git user.email/user.name; without
        # these, git commit fails with exit 128.
        git config --global user.email "ci@intent.local"
        git config --global user.name "Intent CI"

    - name: Install bats libraries manually
      run: |
        mkdir -p tests/lib
        # Retry each clone up to 3 times to absorb transient GitHub HTTP 500s.
        clone_with_retry() {
          local url="$1" dest="$2" i
          [ -d "$dest" ] && return 0
          for i in 1 2 3; do
            git clone "$url" "$dest" && return 0
            echo "clone failed (attempt $i/3): $url" >&2
            rm -rf "$dest"
            sleep 5
          done
          return 1
        }
        clone_with_retry https://github.com/bats-core/bats-support.git tests/lib/bats-support
        clone_with_retry https://github.com/bats-core/bats-assert.git tests/lib/bats-assert
        clone_with_retry https://github.com/bats-core/bats-file.git tests/lib/bats-file

    - name: Run tests
      env:
        BATS_LIB_PATH: ${{ github.workspace }}/tests/lib
      run: |
        # `run_tests.sh` with no argument runs EVERY .bats under tests/ --
        # unit and integration alike -- and exits with bats's status, so a
        # failing test fails the job. It is also the only thing that exports
        # INTENT_HOME, which the suites need; raw bats finds the files and
        # then fails them.
        #
        # Two silent-success paths were deleted here rather than repaired
        # (IN-AG-NO-SILENT-001):
        #
        #   1. A separate "Run integration tests" step ran
        #      `bats integration/end_to_end.bats || echo "...status: $?"`.
        #      The `||` meant the step could not fail the job. It was also
        #      redundant -- this step already covers integration/ -- and it
        #      named one of the two files there, so core_functionality.bats
        #      was never in it. Measured before deleting: the suite passes,
        #      so the swallow was hiding nothing at the time it was removed.
        #   2. A `bats "$test_file" || true` fallback for a missing
        #      run_tests.sh, which would have reported green over an
        #      arbitrary number of failures. A missing runner now fails
        #      loudly, which is the correct signal.
        cd tests
        ./run_tests.sh

  test-macos:
    name: Test on macOS
    runs-on: macos-latest
    
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Fetch all history for proper testing

    # tests/unit/shipped_surface_drift.bats compares the v3 shipped surface
    # against v2-maintenance -- the frozen tree every project on the dev
    # machine actually executes via $INTENT_HOME. A runner has no v2 CHECKOUT,
    # so the guard resolves that surface from this REF instead, and when
    # neither is available it now FAILS rather than skipping.
    #
    # THAT ASYMMETRY IS WHY THIS STEP IS EXPLICIT RATHER THAN IMPLIED. The
    # `fetch-depth: 0` above already brings every branch today, so this looks
    # redundant and is not: dropping it to `1` for speed is an ordinary,
    # plausible edit that would silently return the guard to reporting green
    # over nothing. That was its state for its first day -- all three of its
    # tests skipped in CI, INCLUDING THE POSITIVE CONTROL whose whole job is to
    # prove the comparison looked at something, and the suite printed "All
    # tests passed!". A dependency you can read is one you can keep.
    - name: Fetch v2-maintenance for the shipped-surface drift guard
      run: |
        git fetch --no-tags origin +refs/heads/v2-maintenance:refs/remotes/origin/v2-maintenance
        # Self-checking: if the fetch above silently brought nothing, say so
        # here rather than letting the guard report the whole surface missing.
        git rev-parse --verify origin/v2-maintenance

    - name: Install bats-core
      run: |
        # Install bats with Homebrew
        brew install bats-core
        # Make sure bats is in PATH
        echo "PATH=$PATH:/usr/local/bin:/opt/homebrew/bin" >> $GITHUB_ENV
        which bats
        bats --version

    - name: Install dependencies
      run: |
        # Install jq
        brew install jq
        # shellcheck IS AN ARMED TOOL FOR THIS PROJECT, not an optional extra.
        # `.intent_critic.yml` arms IN-SH-CODE-001 and IN-SH-CODE-002 on it, and
        # the critic REFUSES rather than passing quietly when an armed rule
        # cannot be enforced -- correctly. `ubuntu-latest` ships shellcheck
        # preinstalled and `macos-latest` does not, which is the whole of the
        # macOS/Linux split in this suite: four census arms need the tool
        # present, and the shipped pre-commit gate fails closed without it.
        brew install shellcheck
    
    - name: Set up test environment
      run: |
        cd tests
        mkdir -p lib
        # Retry each clone up to 3 times to absorb transient GitHub HTTP 500s.
        clone_with_retry() {
          local url="$1" dest="$2" i
          [ -d "$dest" ] && return 0
          for i in 1 2 3; do
            git clone "$url" "$dest" && return 0
            echo "clone failed (attempt $i/3): $url" >&2
            rm -rf "$dest"
            sleep 5
          done
          return 1
        }
        clone_with_retry https://github.com/bats-core/bats-support.git lib/bats-support
        clone_with_retry https://github.com/bats-core/bats-assert.git lib/bats-assert
        clone_with_retry https://github.com/bats-core/bats-file.git lib/bats-file
    
    - name: Make scripts executable
      run: |
        chmod +x bin/*
        chmod +x tests/*.sh 2>/dev/null || true

    - name: Add Intent bin to PATH
      run: |
        # See ubuntu job for rationale -- pre_commit_hook.bats needs
        # `intent` resolvable for the critic gate to fire.
        echo "${{ github.workspace }}/bin" >> $GITHUB_PATH

    - name: Configure git identity
      run: |
        # See ubuntu job for rationale -- intent_claude_upgrade.bats
        # NORMALIZE_GITIGNORE scenarios call git commit; needs identity.
        git config --global user.email "ci@intent.local"
        git config --global user.name "Intent CI"

    - name: Run tests
      env:
        BATS_LIB_PATH: ${{ github.workspace }}/tests/lib
      run: |
        # See the Ubuntu leg for the full rationale. The `|| true` fallback
        # that sat here could not fail the job and is deleted rather than
        # repaired; the `chmod +x` it carried is dropped as a duplicate of
        # the "Make scripts executable" step above (Highlander). If that
        # chmod ever fails, this line now fails loudly instead of being
        # silently papered over.
        cd tests
        ./run_tests.sh

  shellcheck:
    name: Shell Script Analysis
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Run ShellCheck
      run: |
        echo "Running ShellCheck on Intent scripts..."
        # Run shellcheck on all shell scripts, but don't fail the build
        find bin -type f -name "intent*" | while read -r script; do
          if file "$script" | grep -q "shell script"; then
            echo "Checking: $script"
            shellcheck "$script" || echo "  ShellCheck found issues (non-blocking)"
          fi
        done
        echo "ShellCheck analysis completed"

  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [test-linux, test-macos]
    if: always()
    
    steps:
    - name: Summary
      run: |
        echo "## Test Summary"
        echo "All test jobs have completed."
        echo "Check individual job results above for details."
        
        # Check job results
        if [ "${{ needs.test-linux.result }}" == "success" ] && [ "${{ needs.test-macos.result }}" == "success" ]; then
          echo "✅ All tests passed!"
        else
          echo "❌ Some tests failed. Please review the logs."
          exit 1
        fi