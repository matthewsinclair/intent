name: PR Checks

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  validate-steel-thread:
    name: Validate Steel Thread Reference
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # **THE CHECK ASKS THE v3 BINARY SINCE THE 3.0.1 CUT**, which pruned the v2
      # shell (`bin/intent`) under AC-00.6. It is built here, with the same
      # toolchain and cache setup as `rust.yml`.
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/rust
      - name: Build the v3 binary the check asks
        run: cargo build --release --manifest-path native/rust/Cargo.toml -p intent-cli

      - name: Check for steel thread reference
        # The PR body arrives through env:, never through `${{ }}` in the script:
        # an expression is substituted into the script text before bash parses
        # it, so a description's `$(...)` or unbalanced quote would run as code.
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          echo "Checking if PR references a steel thread..."

          # Check if it contains a steel thread reference (ST####)
          if echo "$PR_BODY" | grep -qE "ST[0-9]{4}"; then
            echo "✅ Steel thread reference found"
            THREAD_ID=$(echo "$PR_BODY" | grep -oE "ST[0-9]{4}" | head -1)
            echo "Referenced thread: $THREAD_ID"

            # ASK THE TOOL, DO NOT REIMPLEMENT ITS LAYOUT RULE. `st show` exits 0
            # when the thread exists and 1 when it does not, whatever its status
            # and whether or not it is on disk: v3 holds status as a FIELD, and a
            # thread has files under `intent/st/<ID>/` only once hydrated, while
            # its record is always in `intent/.canon/st/<ID>.json`. A directory
            # layout does not survive the port; a command name does.
            #
            # Driven 2026-09-11 in a fresh clone under an empty HOME, which is
            # what this job has: WIP, Completed, Cancelled and never-hydrated
            # threads return 0, and an absent ID returns 1.
            if native/rust/target/release/intent st show "$THREAD_ID" >/dev/null 2>&1; then
              echo "✅ Steel thread ${THREAD_ID} exists"
            else
              echo "❌ Error: Steel thread ${THREAD_ID} not found"
              exit 1
            fi
          else
            echo "ℹ️  No steel thread reference found in PR description"
            echo "Consider referencing the related steel thread (ST####) in your PR"
          fi

  check-documentation:
    name: Documentation Checks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # origin/main exists only in a full fetch. At the default depth of 1 the
          # diff below failed, and piped into grep the step passed silently.
          fetch-depth: 0

      - name: Check for documentation updates
        run: |
          echo "Checking if documentation needs updates..."

          # Taken first, so a diff that fails fails the step rather than reading as no change.
          CHANGED=$(git diff --name-only origin/main..HEAD)

          # Check whether anything under bin/ or native/ was modified
          if printf '%s\n' "$CHANGED" | grep -qE "^(bin|native)/"; then
            echo "Scripts were modified - checking for documentation updates"

            # Check if any documentation was also updated
            if printf '%s\n' "$CHANGED" | grep -qE "(\.md$|usr/|doc/)"; then
              echo "✅ Documentation updates found"
            else
              echo "⚠️  Warning: Scripts modified but no documentation updates found"
              echo "Consider updating relevant documentation"
            fi
          fi

  test-coverage:
    name: Test Coverage Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # origin/main exists only in a full fetch; see check-documentation.
          fetch-depth: 0

      - name: Check for test updates
        run: |
          echo "Checking test coverage for changes..."

          # Taken first, so a diff that fails fails the step rather than reading as no change.
          CHANGED=$(git diff --name-only origin/main..HEAD)

          # Check if any source files were modified
          if printf '%s\n' "$CHANGED" | grep -qE "^(bin|native)/"; then
            echo "Source files were modified - checking for test updates"

            # Check if any tests were also updated
            if printf '%s\n' "$CHANGED" | grep -q "tests/"; then
              echo "✅ Test updates found"
            else
              echo "⚠️  Warning: Source files modified but no test updates found"
              echo "Consider adding or updating tests for your changes"
            fi
          fi

  commit-message-check:
    name: Commit Message Format
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check commit messages
        run: |
          echo "Checking commit message format..."

          # Get commits in this PR
          COMMITS=$(git log --format="%s" origin/main..HEAD)

          # Check each commit message
          echo "$COMMITS" | while read -r commit; do
            echo "Checking: $commit"

            # Basic checks (customize as needed)
            if [ ${#commit} -lt 10 ]; then
              echo "⚠️  Warning: Very short commit message"
            fi

            if [ ${#commit} -gt 72 ]; then
              echo "⚠️  Warning: Commit message exceeds 72 characters"
            fi
          done

          echo "Commit message check completed"

  pr-size-check:
    name: PR Size Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check PR size
        run: |
          echo "Checking PR size..."

          # Count changed lines
          ADDITIONS="${{ github.event.pull_request.additions }}"
          DELETIONS="${{ github.event.pull_request.deletions }}"
          TOTAL_CHANGES=$((ADDITIONS + DELETIONS))

          echo "Lines added: $ADDITIONS"
          echo "Lines deleted: $DELETIONS"
          echo "Total changes: $TOTAL_CHANGES"

          if [ $TOTAL_CHANGES -gt 1000 ]; then
            echo "⚠️  Warning: Large PR (>1000 lines changed)"
            echo "Consider breaking this into smaller PRs"
          elif [ $TOTAL_CHANGES -gt 500 ]; then
            echo "ℹ️  Note: Medium-sized PR (>500 lines changed)"
          else
            echo "✅ PR size is reasonable"
          fi

  doctor-on-the-merge-result:
    name: Intent doctor on the merge result
    runs-on: ubuntu-latest
    # ST0078 WP-04 (AC-04.2). The commit gate runs `intent doctor` on the
    # AUTHOR's machine over the author's tree; the merge the forge makes is a
    # tree nobody's gate judged. On `pull_request`, `actions/checkout` checks out
    # `refs/pull/<n>/merge`, the merge result, so this is the gate for it.
    #
    # A fresh clone under the runner's empty HOME: the store is cold and is
    # loaded from the committed canon on the first verb, which is exactly what a
    # collaborator's clone does.
    #
    # Driven 2026-09-18 against a fresh clone of 69784fc20 under an empty HOME
    # with no core.hooksPath: rc 1 on two counted view-skew findings, committed
    # whiteboard inbox renders that lagged the store. `gate-not-running` does not
    # fire, because it reads core.hooksPath and a runner sets none. vc's decision
    # 48 fixed the cause (a board commit carries its node's whole render), and a
    # fresh clone of the drive's merge result read 0 findings (ST0078,
    # working-in-a-team-drive.log, section 7).
    env:
      XDG_CONFIG_HOME: ""
      XDG_DATA_HOME: ""
      XDG_STATE_HOME: ""
      XDG_RUNTIME_DIR: ""

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/rust
      - name: Build intent
        run: cargo build --release --manifest-path native/rust/Cargo.toml -p intent-cli
      - name: intent doctor
        # No `|| true` (IN-AG-NO-SILENT-001): a finding fails the job.
        run: native/rust/target/release/intent doctor
