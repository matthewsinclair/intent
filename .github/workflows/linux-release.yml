name: linux release

# THE LINUX PACKAGES (ST0081 WP-01): `intent` and `intentd` built static against
# musl for x86_64 and aarch64 Linux, each packaged with the support tree the
# binaries read at run time, so a download installs rather than being a bare
# binary. Intent's Windows route is this package under WSL 2; there is no native
# Windows build.
#
# EVERY STEP IS `bin/int linux`, AND THAT IS THE POINT. hv's Ubuntu VM runs the
# same subcommands by hand before anything is pushed (hv, 2026-10-12), so the
# VM's proof and this workflow's prove one set of steps rather than two copies of
# them. What a step does is in `bin/.devbin/cmd/linux`, not here.
#
# A RELEASE'S CANDIDATE STARTS IT, AND IT STILL WRITES NO RELEASE OBJECT
# (ST0081 WP-02, devbin's D55; ST0091 WP-04, devbin's D64). A cut pushes its
# release commit to `candidate/<tag>`, which starts this run before anything is
# tagged. The cut's object step takes the two packages from the run it finds on
# that commit (release.assets.workflow), uploads them to the release and writes
# SHA256SUMS over every asset there. Nothing here runs `gh release`, so
# `bin/devbin release check`, which reads every workflow, finds no second
# writer. No tag starts it, and `workflow_dispatch` stays for a run by hand at
# any ref.
on:
  workflow_dispatch:
  push:
    branches: ["candidate/**"]

# The fleet's group, as rust.yml and tests.yml carry it.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - triple: x86_64-unknown-linux-musl
            runner: ubuntu-latest
          - triple: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      # THE FLOOR: Oracle Linux 7, on glibc 2.17, older than any distribution the
      # developers are likely to run under WSL. A static binary needs no glibc at
      # all, so this proves the package starts where a binary linked against the
      # runner's own glibc would not.
      FLOOR: oraclelinux:7-slim
    steps:
      - uses: actions/checkout@v7
      # The fleet's Rust, as rust.yml takes it and for its reason (rust.yml's
      # toolchain step): CI follows the fleet's Homebrew stable, its version
      # written once in .github/actions/fleet-rust/action.yml. The step after
      # next records the version this run used.
      - uses: ./.github/actions/fleet-rust
        with:
          targets: ${{ matrix.triple }}
      - name: musl-gcc, for the C the build compiles (SQLite and the tree-sitter grammars)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq musl-tools
      - name: record the toolchain this run actually used
        # pipefail, because the step shell is bash -e without it and the
        # pipeline's status would be tee's.
        run: |
          set -o pipefail
          rustc --version | tee -a "$GITHUB_STEP_SUMMARY"
          cargo --version | tee -a "$GITHUB_STEP_SUMMARY"
      - run: bin/int linux doctor
      - name: build, as the release a candidate names
        # A CANDIDATE'S PAIR IS THE RELEASE'S BYTES, AND IT IS BUILT BEFORE THE
        # TAG EXISTS. source_commit.rs (emit_source_kind) says `release` only
        # where a tag names the commit or DEVBIN_RELEASE_TARGET_TAG is the tag the
        # cut will make; the cut hands that variable to its local legs, and this
        # run is started by the push of `candidate/<tag>`, which hands it nothing.
        # So 3.3.1's Linux packages said `[intent-source-kind:dev]` while its
        # macOS assets said `release`, and a Linux install's `intent --version`
        # read `dev`. On a candidate ref the tag is the branch's last segment, set
        # here for this step alone; any other ref, a run by hand included, builds
        # `dev` as before. The build's own version lines below end in the kind.
        run: |
          case "$GITHUB_REF" in
            refs/heads/candidate/*)
              export DEVBIN_RELEASE_TARGET_TAG="${GITHUB_REF#refs/heads/candidate/}"
              printf 'DEVBIN_RELEASE_TARGET_TAG=%s\n' "$DEVBIN_RELEASE_TARGET_TAG" | tee -a "$GITHUB_STEP_SUMMARY"
              ;;
          esac
          bin/int linux build
      - run: bin/int linux package
      - name: smoke, on the runner
        run: bin/int linux smoke
      - name: smoke, on the floor (AC-01.2)
        run: bin/int linux smoke --in "$FLOOR"
      - uses: actions/upload-artifact@v7
        with:
          name: intent-${{ matrix.triple }}
          path: native/rust/target/linux-dist/intent-${{ matrix.triple }}.tar.gz
          if-no-files-found: error
